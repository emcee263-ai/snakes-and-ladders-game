<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snakes & Ladders — Premium</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   SNAKES & LADDERS — MIDNIGHT PREMIUM EDITION
   Database / game JavaScript remains compatible.
   ========================================================= */

:root{
  --bg:#030712;
  --bg2:#07111f;
  --navy:#0b1224;
  --navy2:#111b32;

  --cyan:#22d3ee;
  --cyan2:#67e8f9;
  --violet:#8b5cf6;
  --violet2:#a78bfa;
  --gold:#f5d58a;
  --gold2:#ffe7a8;

  --white:#f8fafc;
  --text:#e7edf7;
  --muted:#91a0b8;

  --green:#39e58c;
  --red:#ff5574;
  --blue:#4da3ff;
  --yellow:#ffd45a;

  --p1:#ff4f70;
  --p2:#4da3ff;
  --p3:#39e58c;
  --p4:#ffd45a;

  --wood1:#7a4a26;
  --wood2:#3b2112;
  --wood3:#b8783c;

  --glass:rgba(11,18,36,.78);
  --glass2:rgba(18,29,52,.72);
  --border:rgba(255,255,255,.10);
  --border-gold:rgba(245,213,138,.35);

  --shadow:0 24px 70px rgba(0,0,0,.52);
  --shadow-soft:0 12px 35px rgba(0,0,0,.35);

  --radius:20px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:
    Inter,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  color:var(--white);

  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(34,211,238,.16),
      transparent 34%
    ),
    radial-gradient(
      circle at 100% 25%,
      rgba(139,92,246,.13),
      transparent 30%
    ),
    radial-gradient(
      circle at 0% 80%,
      rgba(245,213,138,.055),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      #07111f 0%,
      #030712 48%,
      #01030a 100%
    );

  min-height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    max(14px,env(safe-area-inset-top))
    max(10px,env(safe-area-inset-right))
    max(20px,env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));

  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    radial-gradient(rgba(255,255,255,.7) .5px,transparent .5px);
  background-size:5px 5px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
  z-index:-1;
}

button,
input{
  font-family:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

.hidden{
  display:none !important;
}

/* =========================================================
   TYPOGRAPHY
   ========================================================= */

h1{
  margin:8px 0 5px;

  font-size:clamp(1.5rem,7vw,2.2rem);
  line-height:1.05;

  font-weight:950;
  letter-spacing:2px;
  text-align:center;

  background:
    linear-gradient(
      105deg,
      var(--cyan2),
      var(--cyan) 30%,
      #ffffff 50%,
      var(--gold2) 70%,
      var(--violet2)
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  filter:drop-shadow(0 5px 22px rgba(34,211,238,.18));
}

h1::after{
  content:"";
  display:block;

  width:76px;
  height:2px;

  margin:10px auto 0;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      var(--gold),
      transparent
    );

  box-shadow:
    0 0 16px rgba(34,211,238,.5);
}

h2.subtitle{
  margin:0 0 20px;

  font-size:.86rem;
  line-height:1.5;

  color:var(--muted);
  text-align:center;
  font-weight:550;
}

/* =========================================================
   GLASS CARDS
   ========================================================= */

.card{
  position:relative;

  width:100%;
  max-width:440px;

  padding:23px;

  border-radius:var(--radius);

  background:
    linear-gradient(
      145deg,
      rgba(20,32,57,.82),
      rgba(4,9,20,.86)
    );

  border:1px solid var(--border);

  box-shadow:
    var(--shadow),
    inset 0 1px 0 rgba(255,255,255,.055);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  overflow:hidden;
}

.card::before{
  content:"";

  position:absolute;

  top:0;
  left:12%;
  right:12%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(34,211,238,.75),
      rgba(245,213,138,.55),
      transparent
    );
}

.card::after{
  content:"";

  position:absolute;
  width:180px;
  height:180px;
  top:-110px;
  right:-90px;

  background:radial-gradient(
    circle,
    rgba(139,92,246,.16),
    transparent 70%
  );

  pointer-events:none;
}

/* =========================================================
   BACK BUTTON
   ========================================================= */

.backLink{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-bottom:14px;
  padding:7px 4px;

  background:none;
  border:none;

  color:#8493aa;

  font-size:.8rem;
  font-weight:750;

  cursor:pointer;

  transition:
    color .2s ease,
    transform .2s ease;
}

.backLink:hover{
  color:var(--cyan2);
  transform:translateX(-3px);
}

.backLink:active{
  transform:scale(.94);
}

/* =========================================================
   HOME BUTTONS
   ========================================================= */

.big-btn{
  position:relative;

  width:100%;
  min-height:78px;

  margin-bottom:12px;
  padding:15px 17px;

  display:flex;
  align-items:center;
  gap:14px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:17px;

  color:#fff;

  font-size:1rem;
  font-weight:850;

  text-align:left;

  cursor:pointer;
  overflow:hidden;

  box-shadow:
    0 12px 28px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.13);

  transition:
    transform .18s ease,
    box-shadow .22s ease,
    filter .22s ease;
}

.big-btn::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 15%,
      rgba(255,255,255,.18) 45%,
      transparent 75%
    );

  transform:translateX(-130%);
  transition:transform .65s ease;
}

.big-btn:hover::before{
  transform:translateX(130%);
}

.big-btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.07);

  box-shadow:
    0 18px 36px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.16);
}

.big-btn:active{
  transform:translateY(1px) scale(.982);
}

.big-btn .emoji{
  position:relative;

  width:49px;
  height:49px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  border-radius:15px;

  background:rgba(255,255,255,.12);

  font-size:1.6rem;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 5px 14px rgba(0,0,0,.15);
}

.big-btn small{
  display:block;

  margin-top:4px;

  font-size:.7rem;
  line-height:1.35;
  font-weight:500;

  opacity:.78;
}

#btnLocal{
  background:
    linear-gradient(
      135deg,
      #0e7490,
      #075985 50%,
      #123b66
    );
}

#btnOnline{
  background:
    linear-gradient(
      135deg,
      #6d28d9,
      #5b21b6 50%,
      #312e81
    );
}

/* =========================================================
   SETUP
   ========================================================= */

.setup-row{
  margin-bottom:20px;
}

.setup-row label{
  display:block;

  margin-bottom:9px;

  color:#c8d2e2;

  font-size:.77rem;
  font-weight:800;
  letter-spacing:.3px;
}

.choice-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.choice-btn{
  flex:1;
  min-width:58px;

  padding:11px 7px;

  border:1px solid rgba(148,163,184,.2);
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(17,28,49,.95),
      rgba(7,13,27,.95)
    );

  color:var(--text);

  font-size:.88rem;
  font-weight:800;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);

  transition:
    transform .15s ease,
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.choice-btn:hover{
  border-color:rgba(34,211,238,.45);
}

.choice-btn:active{
  transform:scale(.95);
}

.choice-btn.active{
  color:var(--cyan2);

  border-color:var(--cyan);

  background:
    linear-gradient(
      145deg,
      rgba(8,51,68,.95),
      rgba(8,31,52,.95)
    );

  box-shadow:
    0 0 0 1px rgba(34,211,238,.08),
    0 7px 20px rgba(34,211,238,.13),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* =========================================================
   DIFFICULTY
   ========================================================= */

.mode-btn{
  position:relative;

  width:100%;

  margin-bottom:9px;
  padding:14px 15px;

  border:1px solid rgba(148,163,184,.18);
  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(16,26,46,.95),
      rgba(6,12,24,.95)
    );

  color:var(--text);

  font-size:.86rem;
  font-weight:850;

  text-align:left;

  cursor:pointer;

  transition:
    transform .18s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.mode-btn:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,.28);
}

.mode-btn:active{
  transform:scale(.985);
}

.mode-btn small{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:.69rem;
  line-height:1.4;
  font-weight:500;
}

.mode-btn.active.normal{
  border-color:rgba(57,229,140,.8);

  background:
    linear-gradient(
      145deg,
      rgba(8,61,45,.92),
      rgba(5,31,28,.95)
    );

  box-shadow:
    0 8px 24px rgba(57,229,140,.12),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.mode-btn.active.hard{
  border-color:rgba(255,85,116,.85);

  background:
    linear-gradient(
      145deg,
      rgba(75,15,31,.92),
      rgba(34,8,19,.96)
    );

  box-shadow:
    0 8px 24px rgba(255,85,116,.13),
    inset 0 1px 0 rgba(255,255,255,.06);
}

/* =========================================================
   INPUTS
   ========================================================= */

input[type=text]{
  width:100%;

  padding:14px;

  border:1px solid rgba(148,163,184,.2);
  border-radius:13px;

  outline:none;

  background:
    rgba(3,8,19,.75);

  color:var(--white);

  font-size:.95rem;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input[type=text]::placeholder{
  color:#59677d;
}

input[type=text]:focus{
  border-color:var(--cyan);

  background:#020713;

  box-shadow:
    0 0 0 3px rgba(34,211,238,.09),
    0 10px 24px rgba(0,0,0,.2);
}

input#joinCode{
  text-transform:uppercase;
  letter-spacing:6px;
  text-align:center;
  font-weight:950;
  font-size:1.3rem;
  padding:15px;
}

/* =========================================================
   PRIMARY BUTTON
   ========================================================= */

.primary-btn{
  position:relative;

  width:100%;

  margin-top:10px;
  padding:14px 16px;

  border:none;
  border-radius:14px;

  background:
    linear-gradient(
      105deg,
      var(--cyan),
      #06b6d4 45%,
      #0ea5e9
    );

  color:#032b34;

  font-size:.94rem;
  font-weight:950;

  cursor:pointer;

  box-shadow:
    0 10px 26px rgba(34,211,238,.2),
    inset 0 1px 0 rgba(255,255,255,.45);

  transition:
    transform .16s ease,
    filter .2s ease,
    box-shadow .2s ease;
}

.primary-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);

  box-shadow:
    0 15px 32px rgba(34,211,238,.29),
    inset 0 1px 0 rgba(255,255,255,.5);
}

.primary-btn:active{
  transform:translateY(1px) scale(.985);
}

.primary-btn:disabled{
  opacity:.38;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

/* =========================================================
   HINTS / ERRORS
   ========================================================= */

.hint{
  margin-top:7px;

  color:#77869e;

  font-size:.69rem;
  line-height:1.5;
}

.errorMsg{
  min-height:16px;

  margin-top:8px;

  color:#ff718a;

  font-size:.77rem;
  line-height:1.4;
}

/* =========================================================
   ROOM CODE
   ========================================================= */

#roomCodeBig{
  position:relative;

  margin-bottom:16px;
  padding:18px 12px;

  border:1px dashed rgba(34,211,238,.55);
  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      #071323,
      #050b18
    );

  color:var(--cyan2);

  font-size:clamp(2rem,10vw,2.55rem);
  font-weight:950;
  letter-spacing:8px;
  text-align:center;

  box-shadow:
    inset 0 0 35px rgba(34,211,238,.035),
    0 10px 30px rgba(0,0,0,.28);
}

#roomCodeBig::before{
  content:"ROOM CODE";

  display:block;

  margin-bottom:4px;

  color:#627188;

  font-size:.55rem;
  font-weight:850;
  letter-spacing:2.5px;
}

/* =========================================================
   LOBBY
   ========================================================= */

.lobbyList{
  list-style:none;
  padding:0;
  margin:0 0 16px;
}

.lobbyList li{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:7px;
  padding:11px 12px;

  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(17,29,51,.9),
      rgba(5,11,23,.9)
    );

  font-size:.79rem;

  box-shadow:
    0 5px 14px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.lobbyList .dot{
  width:11px;
  height:11px;

  flex-shrink:0;

  border-radius:50%;

  box-shadow:
    0 0 10px currentColor;
}

.lobbyList .tag{
  margin-left:auto;

  padding:3px 7px;

  border-radius:999px;

  background:rgba(245,213,138,.07);

  color:#9ca9bb;

  font-size:.59rem;
  font-weight:800;
}

/* =========================================================
   GAME
   ========================================================= */

#game{
  width:100%;
  max-width:550px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

/* =========================================================
   TOP BAR
   ========================================================= */

#topbar{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;

  margin-bottom:11px;

  color:var(--muted);
  font-size:.72rem;
}

#topbar button{
  padding:7px 11px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      rgba(23,35,59,.9),
      rgba(7,13,26,.9)
    );

  color:var(--text);

  font-size:.66rem;
  font-weight:750;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05);

  transition:
    transform .15s ease,
    border-color .2s ease,
    background .2s ease;
}

#topbar button:hover{
  border-color:rgba(34,211,238,.4);
  background:#13213b;
}

#topbar button:active{
  transform:scale(.94);
}

#modeTag,
#roomTag{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:4px 10px;

  border-radius:999px;

  font-size:.59rem;
  font-weight:900;
  letter-spacing:.4px;

  white-space:nowrap;
}

#modeTag.normal{
  color:#59efa1;
  background:rgba(57,229,140,.1);
  border:1px solid rgba(57,229,140,.25);
}

#modeTag.hard{
  color:#ff718a;
  background:rgba(255,85,116,.1);
  border:1px solid rgba(255,85,116,.25);
}

#roomTag{
  color:var(--cyan2);
  background:rgba(34,211,238,.09);
  border:1px solid rgba(34,211,238,.23);
}

/* =========================================================
   PLAYER CHIPS
   ========================================================= */

#players{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;

  width:100%;

  margin-bottom:11px;
}

.pchip{
  position:relative;

  display:flex;
  align-items:center;
  gap:6px;

  padding:6px 9px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      rgba(16,27,48,.88),
      rgba(5,11,23,.9)
    );

  color:#cbd5e1;

  font-size:.65rem;
  font-weight:750;

  opacity:.48;

  box-shadow:
    0 5px 13px rgba(0,0,0,.18);

  transition:
    opacity .25s ease,
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.pchip.active{
  opacity:1;

  color:#fff;

  border-color:var(--cyan);

  background:
    linear-gradient(
      145deg,
      rgba(7,48,67,.92),
      rgba(5,23,40,.94)
    );

  transform:translateY(-2px);

  box-shadow:
    0 0 0 1px rgba(34,211,238,.1),
    0 0 18px rgba(34,211,238,.18),
    0 8px 22px rgba(0,0,0,.32);
}

.pchip.active::before{
  content:"";

  position:absolute;

  left:8px;
  right:8px;
  bottom:-4px;

  height:2px;

  border-radius:999px;

  background:var(--cyan);

  box-shadow:0 0 9px var(--cyan);
}

.pchip.done{
  opacity:.28;
}

.dot{
  width:10px;
  height:10px;

  flex-shrink:0;

  border-radius:50%;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.45),
    0 0 7px currentColor;
}

.pchip .pos{
  color:#8492a8;
  font-variant-numeric:tabular-nums;
}

/* =========================================================
   PREMIUM WOOD BOARD
   ========================================================= */

#boardWrap{
  position:relative;

  width:100%;
  max-width:530px;

  aspect-ratio:1/1;

  padding:9px;

  border-radius:21px;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #c18445 0%,
      #75431f 18%,
      #3d2213 48%,
      #8b5128 75%,
      #4a2816 100%
    );

  box-shadow:
    0 28px 65px rgba(0,0,0,.62),
    0 0 0 1px rgba(245,213,138,.22),
    inset 0 0 0 2px rgba(255,255,255,.06),
    inset 0 0 35px rgba(0,0,0,.45);

  isolation:isolate;
}

#boardWrap::before{
  content:"";

  position:absolute;
  inset:3px;

  border-radius:18px;

  border:1px solid rgba(255,231,168,.42);

  box-shadow:
    inset 0 0 0 2px rgba(40,20,8,.38),
    inset 0 0 20px rgba(255,210,130,.12);

  pointer-events:none;

  z-index:5;
}

#boardWrap::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:.18;

  background:
    repeating-linear-gradient(
      6deg,
      transparent 0 8px,
      rgba(255,220,160,.15) 9px,
      transparent 11px 20px
    );

  mix-blend-mode:screen;

  z-index:6;
}

#board{
  position:relative;
  z-index:1;

  width:100%;
  height:100%;

  display:grid;

  grid-template-columns:repeat(10,1fr);
  grid-template-rows:repeat(10,1fr);

  overflow:hidden;

  border-radius:13px;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.35);
}

/* =========================================================
   CELLS
   ========================================================= */

.cell{
  position:relative;

  display:flex;
  align-items:flex-start;
  justify-content:flex-start;

  padding:4px;

  overflow:hidden;

  border-right:1px solid rgba(71,47,20,.14);
  border-bottom:1px solid rgba(71,47,20,.14);

  font-size:clamp(.46rem,1.8vw,.67rem);
  font-weight:950;

  transition:
    filter .2s ease,
    box-shadow .2s ease;
}

.cell:hover{
  filter:brightness(1.07);
}

.cell span{
  position:relative;
  z-index:1;

  text-shadow:
    0 1px 0 rgba(255,255,255,.35);
}

.cell.even{
  color:#3e2b16;

  background:
    linear-gradient(
      145deg,
      #fff5d6,
      #e9d19c 58%,
      #d5b878
    );
}

.cell.odd{
  color:#3c2812;

  background:
    linear-gradient(
      145deg,
      #ead29c,
      #c5a563 58%,
      #ad8a4e
    );
}

      #ecfff6,

    ),
    linear-gradient(

      #55f0a4,
      #159e62
    );

    inset 0 0 18px rgba(255,255,255,.22);
}

.cell.finish{
  color:#422b03;

  background:
    radial-gradient(
      circle at 30% 25%,
      #fffef0,
      transparent 32%
    ),
    linear-gradient(
      145deg,
      #ffe9a6,
      #d99a27
    );

  box-shadow:
    inset 0 0 18px rgba(255,255,255,.23);
}

.cell.snake-cell::after{
  content:"🐍";

  position:absolute;

  right:2px;
  bottom:1px;

  font-size:clamp(.5rem,2vw,.78rem);

  opacity:.7;

  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,.3));
}

.cell.ladder-cell::after{
  content:"🪜";

  position:absolute;

  right:2px;
  bottom:1px;

  font-size:clamp(.5rem,2vw,.78rem);

  opacity:.68;

    drop-shadow(0 2px 2px rgba(0,0,0,.3));

/* =========================================================

   ========================================================= */

#svgOverlay{

  inset:0;

  z-index:2;

  width:100%;
  height:100%;

  pointer-events:none;
}

#svgOverlay .ladder-rail{

}

#svgOverlay .snake-body{
  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,.5))

}

/* =========================================================
   TOKENS — JEWEL STYLE
   ========================================================= */

.tokens-layer{
  position:absolute;
  inset:0;

  z-index:3;

  pointer-events:none;
}

.token{
  position:absolute;

  width:9.5%;
  height:9.5%;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.92);

  color:white;

  font-size:clamp(.47rem,2vw,.67rem);
  font-weight:950;

  text-shadow:
    0 1px 2px rgba(0,0,0,.7);

  box-shadow:
    0 7px 13px rgba(0,0,0,.58),
    inset 0 3px 5px rgba(255,255,255,.45),
    inset 0 -4px 6px rgba(0,0,0,.22),
    0 0 9px rgba(255,255,255,.16);

  transition:
    left .32s cubic-bezier(.22,.61,.36,1),
    top .32s cubic-bezier(.22,.61,.36,1),
    transform .2s ease;

  overflow:hidden;
}

.token::before{
  content:"";

  position:absolute;

  width:42%;
  height:24%;

  top:12%;
  left:18%;

  border-radius:50%;

  background:rgba(255,255,255,.62);

  filter:blur(1px);

  transform:rotate(-25deg);
}

.token:hover{
  transform:scale(1.12);
}

/* =========================================================
   CONTROLS
   ========================================================= */

#controls{
  width:100%;
  max-width:530px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:12px;

  margin-top:15px;

  padding:0 2px;
}

/* =========================================================
   PREMIUM DICE
   ========================================================= */

#diceBox{
  position:relative;

  width:66px;
  height:66px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f0f3f8 42%,
      #c8d0dc
    );

  border:1px solid rgba(255,255,255,.9);

  color:#172033;

  font-size:1.85rem;
  font-weight:950;

  user-select:none;

  box-shadow:
    0 12px 25px rgba(0,0,0,.48),
    inset 0 2px 2px rgba(255,255,255,.95),
    inset 0 -4px 7px rgba(0,0,0,.1),
    0 0 0 2px rgba(245,213,138,.1);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

#diceBox::after{
  content:"";

  position:absolute;
  inset:4px;

  border-radius:13px;

  border:1px solid rgba(0,0,0,.08);

  pointer-events:none;
}

#diceBox.rolling{
  animation:dicePremium .42s infinite;
}

@keyframes dicePremium{
  0%{
    transform:rotate(0deg) translateY(0) scale(1);
  }

  25%{
    transform:rotate(-14deg) translateY(-3px) scale(1.06);
  }

  50%{
    transform:rotate(0deg) translateY(-6px) scale(1.1);
  }

  75%{
    transform:rotate(14deg) translateY(-3px) scale(1.06);
  }

  100%{
    transform:rotate(0deg) translateY(0) scale(1);
  }
}

/* =========================================================
   ROLL BUTTON
   ========================================================= */

#rollBtn{
  position:relative;

  flex:1;

  min-height:62px;

  padding:15px 20px;

  border:none;
  border-radius:17px;

  background:
    linear-gradient(
      105deg,
      #c58b31,
      #f5d58a 40%,
      #d5a84e 70%,
      #9b681e
    );

  color:#261706;

  font-size:.96rem;
  font-weight:950;
  letter-spacing:.4px;

  cursor:pointer;
  overflow:hidden;

  box-shadow:

    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -2px 0 rgba(93,54,9,.28);

  transition:
    transform .16s ease,
    filter .2s ease,
    box-shadow .2s ease;
}

#rollBtn::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent,
      rgba(255,255,255,.42),
      transparent
    );

  transform:translateX(-120%);

  transition:transform .55s ease;
}

#rollBtn:hover::before{
  transform:translateX(120%);
}

#rollBtn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);

  box-shadow:
    0 17px 34px rgba(177,124,35,.34),
    inset 0 1px 0 rgba(255,255,255,.75);
}

#rollBtn:active{
  transform:translateY(1px) scale(.985);
}

#rollBtn:disabled{
  opacity:.38;
  cursor:default;
  transform:none;
  box-shadow:none;
}

/* =========================================================
   TURN MESSAGE
   ========================================================= */

#turnMsg{
  width:100%;
  max-width:530px;

  min-height:23px;

  margin-top:10px;

  padding:5px 9px;

  color:#c8d3e4;

  font-size:.78rem;
  font-weight:650;

  line-height:1.4;

  text-align:center;
}

/* =========================================================
   GAME LOG
   ========================================================= */

#log{
  width:100%;
  max-width:530px;

  max-height:100px;

  overflow-y:auto;

  margin-top:8px;
  padding:10px 12px;

  border:1px solid rgba(255,255,255,.065);
  border-radius:13px;

  background:
    linear-gradient(

      rgba(12,21,38,.9),
      rgba(3,8,18,.94)

  font-size:.66rem;
  line-height:1.55;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);
}

#log::-webkit-scrollbar{
  width:4px;
}

#log::-webkit-scrollbar-track{
  background:transparent;
}

#log::-webkit-scrollbar-thumb{
  background:#34435c;
  border-radius:999px;
}

/* =========================================================
   WIN OVERLAY
   ========================================================= */

#winOverlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:18px;

  padding:25px;

  text-align:center;

      rgba(19,38,67,.72),

  -webkit-backdrop-filter:blur(14px);

  animation:winFade .35s ease both;
}

#winOverlay::before,
#winOverlay::after{
  content:"";

  position:absolute;

  border-radius:50%;

  pointer-events:none;
}

#winOverlay::before{
  width:280px;
  height:280px;

  background:
    radial-gradient(

      rgba(34,211,238,.16),
      transparent 68%
    );

}

#winOverlay::after{
  width:190px;
  height:190px;

  background:
    radial-gradient(
      circle,
      rgba(139,92,246,.14),
      transparent 68%
    );

  animation:winGlow 2.2s ease-in-out .8s infinite reverse;
}

#winOverlay h2{

  z-index:1;

  margin:0;

  max-width:90%;

  font-size:clamp(1.55rem,8vw,2.25rem);
  line-height:1.15;

  font-weight:950;
  letter-spacing:.5px;

  background:
    linear-gradient(
      105deg,
      var(--cyan2),
      #ffffff 38%,
      var(--gold2) 68%,
      var(--violet2)
    );

  background-clip:text;
  color:transparent;

  filter:
    drop-shadow(0 8px 22px rgba(34,211,238,.2));
}

#winOverlay button{
  position:relative;
  z-index:1;

  padding:14px 28px;

  border:1px solid rgba(255,255,255,.35);
  border-radius:14px;

  background:
    linear-gradient(
      105deg,
      var(--cyan),
      #67e8f9,
      #8b5cf6
    );

  color:#06101b;

  font-size:.9rem;
  font-weight:950;

  cursor:pointer;

  box-shadow:
    0 13px 30px rgba(34,211,238,.25),
    inset 0 1px 0 rgba(255,255,255,.6);

  transition:
    transform .16s ease,
    filter .2s ease;
}

#winOverlay button:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

#winOverlay button:active{
  transform:scale(.96);
}

@keyframes winFade{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes winGlow{
  0%,100%{
    transform:scale(.9);
    opacity:.55;
  }

  50%{
    transform:scale(1.15);
    opacity:1;
  }
}

/* =========================================================
   HOVER / FOCUS
   ========================================================= */

button:focus-visible,
input:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
}

  const CODE_CHARS =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  function randomCode(){

    let c="";

    for(let i=0;i<5;i++){
      c+=CODE_CHARS[
        Math.floor(
          Math.random()*CODE_CHARS.length
        )
      ];
    }

    return c;
  }

  async function generateUniqueCode(){

    for(let tries=0;tries<6;tries++){

      const code=randomCode();

      const {data}=await sb
        .from("slgames")
        .select("code")
        .eq("code",code)
        .maybeSingle();

      if(!data){
        return code;
      }

    }

    return randomCode()+Math.floor(Math.random()*9);
  }

  function mapRowToState(row){

    return {
      mode:row.mode,
      total:row.total,
      hostUid:row.host_uid,
      status:row.status,
      turnIndex:row.turn_index,
      players:row.players,
      moveSeq:row.move_seq,
      lastMove:row.last_move,
      winnerId:row.winner_id,
      version:row.version
    };

  }

  /* =========================================================
     OPTIMISTIC CONCURRENCY
     ========================================================= */

  async function updateRoomOptimistic(
    code,
    mutateFn,
    maxRetries=6
  ){

    for(let i=0;i<maxRetries;i++){

      const {
        data:current,
        error
      }=await sb
        .from("slgames")
        .select("*")
        .eq("code",code)
        .single();

      if(error || !current){
        throw new Error("NOTFOUND");
      }

      const patch=mutateFn(current);

      if(patch===null){
        return current;
      }

      const newVersion =
        (current.version||0)+1;

      const {
        data:updated,
        error:updErr
      }=await sb
        .from("slgames")
        .update({
          ...patch,
          version:newVersion
        })
        .eq("code",code)
        .eq("version",current.version||0)
        .select();

      if(updErr){
        throw updErr;
      }

      if(updated && updated.length>0){
        return updated[0];
      }
    }

    throw new Error("CONFLICT");
  }

          "Enter the room code.";

      const btn=
        document.getElementById("joinRoomBtn");

      try{

        await updateRoomOptimistic(
          code,
          current=>{

            if(current.status!=="waiting"){
              throw new Error("STARTED");
            }

            const already=
              current.players.find(
                p=>p.uid===MY_UID
              );

            if(already){
              return null;
            }

            const idx=
              current.players.findIndex(
                p=>!p.isBot && !p.uid
              );

            if(idx===-1){
              throw new Error("FULL");
            }

            const players=
              current.players.map(
                (p,i)=>
                  i===idx
                    ? {
                        ...p,
                        uid:MY_UID,
                        name:myName()
                      }
                    : p
              );

            return {players};
          }
        );

        enterLobby(code);

      }catch(e){

        if(e.message==="NOTFOUND"){
          errEl.textContent=
            "No room found with that code.";
        }else if(e.message==="STARTED"){
          errEl.textContent=
            "That game already started.";
        }else if(e.message==="FULL"){
          errEl.textContent=
            "That room is full.";
        }else{
          console.error(e);
          errEl.textContent=
            "Couldn't join. Try again.";

      }

  function attachRoomListener(code){

    if(roomChannel){

      sb.removeChannel(roomChannel);

      roomChannel=null;
    }

    mode="online";

    let processedSeq=-1;
    let inGame=false;

    function handleRow(row){

      const state=mapRowToState(row);

      if(state.status==="waiting"){

        renderLobby(state);

        return;
      }

      if(!inGame){

        inGame=true;

        enterOnlineGameScreen(state);

        processedSeq=-1;
      }

      handleOnlineSnapshot(
        state,
        processedSeq,
        seq=>processedSeq=seq
      );
    }

    sb
      .from("slgames")
      .select("*")
      .eq("code",code)
      .single()
      .then(({data,error})=>{

        if(error || !data){

          alert(
            "Room not found or closed."
          );

          showScreen("home");

          return;
        }

        handleRow(data);
      });

    roomChannel=
      sb
        .channel("room_"+code)
        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"slgames",
            filter:`code=eq.${code}`
          },
          payload=>{

            if(payload.eventType==="DELETE"){

              alert("Room closed.");

              showScreen("home");

              leaveLobby();

              return;
            }

            handleRow(payload.new);
          }
        )
        .subscribe();
  }

  /* =========================================================
     BOARD GEOMETRY
     ========================================================= */

  function squareToRC(n){

    const idx=n-1;

    const rowFromBottom=
      Math.floor(idx/10);

    let col=idx%10;

    if(rowFromBottom%2===1){
      col=9-col;
    }

    const row=
      9-rowFromBottom;

    return {
      row,
      col
    };
  }

  function centerXY(n){

    const {row,col}=squareToRC(n);

    return {
      x:col*50+25,
      y:row*50+25
    };
  }

  let boardSnakes={};
  let boardLadders={};

  function buildBoardDOM(){

    const board=
      document.getElementById("board");

    board.innerHTML="";

    for(let domRow=0;domRow<10;domRow++){

      for(let domCol=0;domCol<10;domCol++){

        const rowFromBottom=
          9-domRow;

        let col=domCol;

        if(rowFromBottom%2===1){
          col=9-domCol;
        }

        const num=
          rowFromBottom*10+
          col+
          1;

        const cell=
          document.createElement("div");

        let cls=
          "cell "+
          (
            (domRow+domCol)%2===0
              ? "even"
              : "odd"
          );

        if(num===1){
          cls+=" start";
        }

        if(num===100){
          cls+=" finish";
        }

        if(boardSnakes[num]){
          cls+=" snake-cell";
        }

        if(boardLadders[num]){
          cls+=" ladder-cell";
        }

        cell.className=cls;

        const span=
          document.createElement("span");

        span.textContent=num;

        cell.appendChild(span);

        board.appendChild(cell);
      }
    }
  }

  /* =========================================================
     PREMIUM SNAKES + LADDERS
     ========================================================= */

  function drawOverlay(){

    const svg=
      document.getElementById("svgOverlay");

    svg.innerHTML="";

    const ns=
      "http://www.w3.org/2000/svg";

    const defs=
      document.createElementNS(
        ns,
        "defs"
      );

    svg.appendChild(defs);

    function addGradient(
      id,
      c1,
      c2
    ){

      const g=
        document.createElementNS(
          ns,
          "linearGradient"
        );

      g.setAttribute("id",id);

      g.setAttribute(
        "x1",
        "0%"
      );

      g.setAttribute(
        "y1",
        "0%"
      );

      g.setAttribute(
        "x2",
        "100%"
      );

      g.setAttribute(
        "y2",
        "100%"
      );

      const s1=
        document.createElementNS(
          ns,
          "stop"
        );

      s1.setAttribute(
        "offset",
        "0%"
      );

      s1.setAttribute(
        "stop-color",
        c1
      );

      const s2=
        document.createElementNS(
          ns,
          "stop"
        );

      s2.setAttribute(
        "offset",
        "100%"
      );

      s2.setAttribute(
        "stop-color",
        c2
      );

      g.appendChild(s1);
      g.appendChild(s2);

      defs.appendChild(g);
    }

    addGradient(
      "snakeGrad",
      "#ff5574",
      "#7c1836"
    );

    addGradient(
      "ladderGrad",
      "#ffe7a8",
      "#a76b1c"
    );

    addGradient(
      "ladderStepGrad",
      "#fff0b9",
      "#c18432"
    );

    function el(tag,attrs){

      const e=
        document.createElementNS(
          ns,
          tag
        );

      Object.entries(attrs).forEach(
        ([k,v])=>{
          e.setAttribute(k,v);
        }
      );

      svg.appendChild(e);

      return e;
    }

    /* ---------- LADDERS ---------- */

    Object.entries(boardLadders)
      .forEach(([from,to])=>{

        const a=
          centerXY(
            parseInt(from,10)
          );

        const b=
          centerXY(
            parseInt(to,10)
          );

        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const len=
          Math.hypot(dx,dy);

        const nx=
          -dy/len*7;

        const ny=
          dx/len*7;

        /* dark shadow rails */

        el("line",{
          x1:a.x+nx,
          y1:a.y+ny,
          x2:b.x+nx,
          y2:b.y+ny,
          stroke:"#2b1607",
          "stroke-width":8,
          "stroke-linecap":"round",
          opacity:".55"
        });

        el("line",{
          x1:a.x-nx,
          y1:a.y-ny,
          x2:b.x-nx,
          y2:b.y-ny,
          stroke:"#2b1607",
          "stroke-width":8,
          "stroke-linecap":"round",
          opacity:".55"
        });

        /* gold rails */

        el("line",{
          x1:a.x+nx,
          y1:a.y+ny,
          x2:b.x+nx,
          y2:b.y+ny,
          stroke:"url(#ladderGrad)",
          "stroke-width":5,
          "stroke-linecap":"round",
          class:"ladder-rail"
        });

        el("line",{
          x1:a.x-nx,
          y1:a.y-ny,
          x2:b.x-nx,
          y2:b.y-ny,
          stroke:"url(#ladderGrad)",
          "stroke-width":5,
          "stroke-linecap":"round",
          class:"ladder-rail"
        });

        const steps=
          Math.max(
            4,
            Math.round(len/20)
          );

        for(
          let i=1;
          i<steps;
          i++
        ){

          const px=
            a.x+
            dx*i/steps;

          const py=
            a.y+
            dy*i/steps;

          el("line",{
            x1:px+nx,
            y1:py+ny,
            x2:px-nx,
            y2:py-ny,
            stroke:"url(#ladderStepGrad)",
            "stroke-width":4,
            "stroke-linecap":"round",
            class:"ladder-rail"
          });
        }
      });

    /* ---------- SNAKES ---------- */

    Object.entries(boardSnakes)
      .forEach(([from,to])=>{

        const a=
          centerXY(
            parseInt(from,10)
          );

        const b=
          centerXY(
            parseInt(to,10)
          );

        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const dist=
          Math.hypot(dx,dy);

        const nx=-dy/dist;
        const ny=dx/dist;

        const wave=
          Math.min(26,dist*.16) *
          (
            (
              parseInt(from,10)+
              parseInt(to,10)
            )%2===0
              ? 1
              : -1
          );

        const p1={
          x:a.x+dx*.33+nx*wave,
          y:a.y+dy*.33+ny*wave
        };

        const p2={
          x:a.x+dx*.66-nx*wave,
          y:a.y+dy*.66-ny*wave
        };

        const d=
          `M ${a.x} ${a.y}
           C ${p1.x} ${p1.y},
             ${p2.x} ${p2.y},
             ${b.x} ${b.y}`;

        /* shadow */

        el("path",{
          d,
          stroke:"#220711",
          "stroke-width":11,
          fill:"none",
          "stroke-linecap":"round",
          opacity:".48"
        });

        /* body */

        el("path",{
          d,
          stroke:"url(#snakeGrad)",
          "stroke-width":8,
          fill:"none",
          "stroke-linecap":"round",
          class:"snake-body"
        });

        /* highlight */

        el("path",{
          d,
          stroke:"#ffb3c1",
          "stroke-width":1.5,
          fill:"none",
          "stroke-linecap":"round",
          opacity:".5",
          "stroke-dasharray":"2 8",
          class:"snake-body"
        });

        /* tail */

        el("circle",{
          cx:b.x,
          cy:b.y,
          r:3.3,
          fill:"#7c1836",
          stroke:"#ff8da3",
          "stroke-width":"1"
        });

        /* head */

        el("ellipse",{
          cx:a.x,
          cy:a.y,
          rx:10,
          ry:8,
          fill:"#d92f58",
          stroke:"#4b0b20",
          "stroke-width":"1.5",
          class:"snake-body"
        });

        const hx=-dy/dist;
        const hy=dx/dist;

        /* eyes */

        el("circle",{
          cx:a.x+hx*4-dx/dist*2,
          cy:a.y+hy*4-dy/dist*2,
          r:1.8,
          fill:"#fff"
        });

        el("circle",{
          cx:a.x-hx*4-dx/dist*2,
          cy:a.y-hy*4-dy/dist*2,
          r:1.8,
          fill:"#fff"
        });

        el("circle",{
          cx:a.x+hx*4-dx/dist*2,
          cy:a.y+hy*4-dy/dist*2,
          r:.8,
          fill:"#16040a"
        });

        el("circle",{
          cx:a.x-hx*4-dx/dist*2,
          cy:a.y-hy*4-dy/dist*2,
          r:.8,
          fill:"#16040a"
        });

        /* tongue */

        const fx1=
          a.x-
          dx/dist*13+
          hx*2.5;

        const fy1=
          a.y-
          dy/dist*13+
          hy*2.5;

        const fx2=
          a.x-
          dx/dist*13-
          hx*2.5;

        const fy2=
          a.y-
          dy/dist*13-
          hy*2.5;

        el("line",{
          x1:a.x-dx/dist*8,
          y1:a.y-dy/dist*8,
          x2:fx1,
          y2:fy1,
          stroke:"#ff9db0",
          "stroke-width":1
        });

        el("line",{
          x1:a.x-dx/dist*8,
          y1:a.y-dy/dist*8,
          x2:fx2,
          y2:fy2,
          stroke:"#ff9db0",
          "stroke-width":1
        });

      });
  }

  /* =========================================================
     PLAYER RENDERING
     ========================================================= */

  function renderPlayers(state){

    const wrap=
      document.getElementById("players");

    wrap.innerHTML="";

    const cp=
      state.players[state.turnIndex];

    state.players.forEach(p=>{

      const chip=
        document.createElement("div");

      chip.className=
        "pchip"+
        (
          cp &&
          p.id===cp.id &&
          !p.finished
            ? " active"
            : ""
        )+
        (
          p.finished
            ? " done"
            : ""
        );

      const label=
        p.name ||
        `Seat ${p.id}`;

      chip.innerHTML=`
        <span
          class="dot"
          style="
            background:${COLORS[p.id]};
            color:${COLORS[p.id]};
          "
        ></span>
        ${label}${p.isBot?" 🤖":""}
        <span class="pos">
          ${p.finished ? "🏁" : "#"+p.pos}
        </span>
      `;

      wrap.appendChild(chip);

    });
  }

  function renderTokens(players){

    const layer=
      document.getElementById("tokensLayer");

    layer.innerHTML="";

    const byPos={};

    players.forEach(p=>{

      if(p.pos<1){
        return;
      }

      byPos[p.pos]=
        byPos[p.pos] || [];

      byPos[p.pos].push(p);

    });

    Object.entries(byPos)
      .forEach(([pos,plist])=>{

        const {x,y}=
          centerXY(
            parseInt(pos,10)
          );

        plist.forEach((p,i)=>{

          const offset=
            plist.length>1
              ? (
                  i-
                  (plist.length-1)/2
                )*6
              : 0;

          const elDiv=
            document.createElement("div");

          elDiv.className="token";

          elDiv.style.background=
            COLORS[p.id];

          elDiv.style.color=
            "#fff";

          elDiv.style.left=
            `calc(${(x+offset)/500*100}% - 4.75%)`;

          elDiv.style.top=
            `calc(${y/500*100}% - 4.75%)`;

          elDiv.textContent=p.id;

          layer.appendChild(elDiv);

        });
      });
  }

  function setTurnMessage(msg){

    document.getElementById(
      "turnMsg"
    ).textContent=msg;
  }

  function logMsg(msg){

    const l=
      document.getElementById("log");

    const line=
      document.createElement("div");

    line.textContent=msg;

    l.prepend(line);
  }

  /* =========================================================
     GAME ENGINE
     ========================================================= */

  function computeMove(
    gameState,
    roll
  ){

    const players=
      gameState.players.map(
        p=>({...p})
      );

    const pIdx=
      gameState.turnIndex;

    const p=
      players[pIdx];

    const from=p.pos;

    const isHard=
      gameState.mode==="hard";

    let landed=
      from+roll;

    let overshoot=false;

    if(landed>100){

      if(isHard){

        overshoot=true;
        landed=from;

      }else{

        landed=
          100-
          (landed-100);
      }
    }

    let snake=null;
    let ladder=null;
    let finishedNow=false;

    let finalPos=landed;

    if(!overshoot){

      if(boardSnakes[landed]){

        snake={
          from:landed,
          to:boardSnakes[landed]
        };

        finalPos=
          boardSnakes[landed];

      }else if(boardLadders[landed]){

        ladder={
          from:landed,
          to:boardLadders[landed]
        };

        finalPos=
          boardLadders[landed];
      }
    }

    p.pos=finalPos;

    if(finalPos===100){

      p.finished=true;
      finishedNow=true;
    }

    players[pIdx]=p;

    let bonus=false;

    if(!p.finished && roll===6){

      bonus=
        isHard
          ? Math.random()<
            HARD_SIX_BONUS_CHANCE
          : true;
    }

    let turnIndex=
      gameState.turnIndex;

    let status=
      gameState.status;

    let winnerId=
      gameState.winnerId || null;

    if(finishedNow){

      status="finished";
      winnerId=p.id;

    }else if(!bonus){

      let next=turnIndex;

      for(let i=0;i<players.length;i++){

        next=
          (next+1)%
          players.length;

        if(!players[next].finished){
          break;
        }
      }

      turnIndex=next;
    }

    const lastMove={

      seq:
        (gameState.moveSeq||0)+1,

      playerId:p.id,

      from,

      to:landed,

      roll,

      snake,

      ladder,

      finishedNow,

      bonus,

      overshoot
    };

    return {
      players,
      turnIndex,
      status,
      winnerId,
      moveSeq:lastMove.seq,
      lastMove
    };
  }

  /* =========================================================
     MOVE ANIMATION
     ========================================================= */

  function playMoveAnimation(
    finalPlayers,
    lastMove,
    onDone
  ){

    const activePlayer=
      finalPlayers.find(
        p=>p.id===lastMove.playerId
      );

    const working=
      finalPlayers.map(
        p=>
          p.id===lastMove.playerId
            ? {
                ...p,
                pos:lastMove.from
              }
            : p
      );

    const activeIdx=
      working.findIndex(
        p=>p.id===lastMove.playerId
      );

    let cur=lastMove.from;

    const target=
      lastMove.overshoot
        ? lastMove.from
        : lastMove.to;

    const dir=
      target>cur
        ? 1
        : -1;

    logMsg(
      `${activePlayer.name||("Seat "+activePlayer.id)} rolled ${lastMove.roll}`
    );

    function step(){

      if(cur===target){

        afterMain();

        return;
      }

      cur+=dir;

      working[activeIdx]={
        ...working[activeIdx],
        pos:cur
      };

      renderTokens(working);

      setTimeout(step,135);
    }

    function afterMain(){

      if(lastMove.snake){

        setTurnMessage(
          `🐍 ${activePlayer.name} bitten by a snake! ${lastMove.snake.from} → ${lastMove.snake.to}`
        );

        logMsg(
          `🐍 Snake: ${lastMove.snake.from} → ${lastMove.snake.to}`
        );

        setTimeout(()=>{

          working[activeIdx]={
            ...working[activeIdx],
            pos:lastMove.snake.to
          };

          renderTokens(working);

          setTimeout(
            onDone,
            400
          );

        },450);

      }else if(lastMove.ladder){

        setTurnMessage(
          `🪜 ${activePlayer.name} climbs a ladder! ${lastMove.ladder.from} → ${lastMove.ladder.to}`
        );

        logMsg(
          `🪜 Ladder: ${lastMove.ladder.from} → ${lastMove.ladder.to}`
        );

        setTimeout(()=>{

          working[activeIdx]={
            ...working[activeIdx],
            pos:lastMove.ladder.to
          };

          renderTokens(working);

          setTimeout(
            onDone,
            400
          );

        },450);

      }else if(lastMove.overshoot){

        setTurnMessage(
          `${activePlayer.name} rolled ${lastMove.roll} but overshot 100! Stays put.`
        );

        setTimeout(
          onDone,
          350
        );

      }else{

        setTimeout(
          onDone,
          170
        );
      }
    }

    step();
  }

  /* =========================================================
     PREMIUM DICE ANIMATION
     ========================================================= */

  function rollDiceAnimated(cb){

    const dice=
      document.getElementById("diceBox");

    dice.classList.add("rolling");

    let ticks=0;

    const spin=
      setInterval(()=>{

        dice.textContent=
          1+
          Math.floor(
            Math.random()*6
          );

        ticks++;

        if(ticks>6){

          clearInterval(spin);

          const roll=
            1+
            Math.floor(
              Math.random()*6
            );

          dice.textContent=roll;

          dice.classList.remove("rolling");

          cb(roll);
        }

      },70);
  }

  /* =========================================================
     LOCAL GAME
     ========================================================= */

  let mode=null;
  let localState=null;

  function startLocalGame(
    players,
    gameMode
  ){

    mode="local";

    boardSnakes=
      BOARDS[gameMode].snakes;

    boardLadders=
      BOARDS[gameMode].ladders;

    localState={
      mode:gameMode,
      players,
      turnIndex:0,
      status:"playing",
      winnerId:null,
      moveSeq:0
    };

    showScreen("game");

    document
      .getElementById("roomTag")
      .classList
      .add("hidden");

    const modeTag=
      document.getElementById("modeTag");

    modeTag.textContent=
      gameMode==="hard"
        ? "HARD"
        : "NORMAL";

    modeTag.className=
      gameMode==="hard"
        ? "hard"
        : "normal";

    document.getElementById(
      "log"
    ).innerHTML="";

    document
      .getElementById("winOverlay")
      .classList
      .add("hidden");

    buildBoardDOM();
    drawOverlay();

    renderPlayers(localState);
    renderTokens(localState.players);

    setTurnMessage(
      `${localState.players[0].name}'s turn`
    );

    updateLocalRollButton();

    maybeAutoRollLocalBot();
  }

  function updateLocalRollButton(){

    const btn=
      document.getElementById("rollBtn");

    const cp=
      localState.players[
        localState.turnIndex
      ];

    btn.disabled=cp.isBot;

    btn.textContent=
      cp.isBot
        ? `${cp.name} (bot) rolling…`
        : "ROLL DICE";
  }

  function maybeAutoRollLocalBot(){

    const cp=
      localState.players[
        localState.turnIndex
      ];

    if(
      cp.isBot &&
      localState.status==="playing"
    ){

      setTimeout(
        ()=>doLocalRoll(),
        700
      );
    }
  }

  document
    .getElementById("rollBtn")
    .addEventListener("click",()=>{

      if(mode!=="local"){
        return;
      }

      const cp=
        localState.players[
          localState.turnIndex
        ];

      if(cp.isBot){
        return;
      }

      doLocalRoll();
    });

  let localBusy=false;

  function doLocalRoll(){

    if(localBusy){
      return;
    }

    localBusy=true;

    document
      .getElementById("rollBtn")
      .disabled=true;

    rollDiceAnimated(roll=>{

      const result=
        computeMove(
          localState,
          roll
        );

      playMoveAnimation(
        result.players,
        result.lastMove,
        ()=>{

          localState={
            ...localState,

            players:result.players,

            turnIndex:
              result.turnIndex,

            status:
              result.status,

            winnerId:
              result.winnerId,

            moveSeq:
              result.moveSeq
          };

          renderPlayers(localState);
          renderTokens(localState.players);

          localBusy=false;

          if(
            localState.status==="finished"
          ){

            endGame(localState);

          }else{

            if(result.lastMove.bonus){

              setTurnMessage(
                "🎲 Rolled a 6 — go again!"
              );

            }else{

              setTurnMessage(
                `${localState.players[localState.turnIndex].name}'s turn`
              );
            }

            updateLocalRollButton();

            maybeAutoRollLocalBot();
          }

        }
      );
    });
  }

  /* =========================================================
     ONLINE GAME
     ========================================================= */

  let onlineGameState=null;
  let onlineBusy=false;

  function enterOnlineGameScreen(state){

    boardSnakes=
      BOARDS[state.mode].snakes;

    boardLadders=
      BOARDS[state.mode].ladders;

    showScreen("game");

    document
      .getElementById("roomTag")
      .classList
      .remove("hidden");

    document
      .getElementById("roomTag")
      .textContent=
      "ROOM "+currentRoomCode;

    const modeTag=
      document.getElementById("modeTag");

    modeTag.textContent=
      state.mode==="hard"
        ? "HARD"
        : "NORMAL";

    modeTag.className=
      state.mode==="hard"
        ? "hard"
        : "normal";

    document.getElementById(
      "log"
    ).innerHTML="";

    document
      .getElementById("winOverlay")
      .classList
      .add("hidden");

    buildBoardDOM();
    drawOverlay();
  }

  function handleOnlineSnapshot(
    state,
    processedSeq,
    setProcessed
  ){

    const incomingSeq=
      state.moveSeq||0;

    if(
      incomingSeq>0 &&
      incomingSeq>processedSeq &&
      state.lastMove
    ){

      setProcessed(incomingSeq);

      playMoveAnimation(
        state.players,
        state.lastMove,
        ()=>{
          onlineGameState=state;
          settleOnlineUI(state);
        }
      );

    }else{

      setProcessed(incomingSeq);

      onlineGameState=state;

      renderPlayers(state);
      renderTokens(state.players);

      settleOnlineUI(state);
    }
  }

  function settleOnlineUI(state){

    renderPlayers(state);
    renderTokens(state.players);

    if(state.status==="finished"){

      endGame(state);

      return;
    }

    const cp=
      state.players[
        state.turnIndex
      ];

    const myTurn=
      !cp.isBot &&
      cp.uid===MY_UID;

    const iAmHost=
      state.hostUid===MY_UID;

    const btn=
      document.getElementById("rollBtn");

    btn.disabled=
      !myTurn ||
      onlineBusy;

    btn.textContent=
      myTurn
        ? "ROLL DICE"
        : `Waiting for ${cp.name||"player"}…`;

    if(myTurn){

      setTurnMessage(
        "Your turn — roll the dice!"
      );

    }else{

      setTurnMessage(
        `${cp.name||("Seat "+cp.id)}${cp.isBot?" 🤖":""}'s turn…`
      );
    }

    if(
      cp.isBot &&
      iAmHost &&
      !onlineBusy
    ){

      setTimeout(
        ()=>driveBotTurn(state.turnIndex),
        800
      );
    }
  }

  document
    .getElementById("rollBtn")
    .addEventListener("click",()=>{

      if(
        mode!=="online" ||
        onlineBusy
      ){
        return;
      }

      const state=
        onlineGameState;

      if(!state){
        return;
      }

      const cp=
        state.players[
          state.turnIndex
        ];

      if(
        cp.isBot ||
        cp.uid!==MY_UID
      ){
        return;
      }

      onlineBusy=true;

      document
        .getElementById("rollBtn")
        .disabled=true;

      rollDiceAnimated(roll=>{

        commitOnlineMove(
          state.turnIndex,
          roll
        ).finally(()=>{
          onlineBusy=false;
        });

      });
    });

  function driveBotTurn(
    expectedTurnIndex
  ){

    if(onlineBusy){
      return;
    }

    onlineBusy=true;

    rollDiceAnimated(roll=>{

      commitOnlineMove(
        expectedTurnIndex,
        roll
      ).finally(()=>{
        onlineBusy=false;
      });

    });
  }

  async function commitOnlineMove(
    expectedTurnIndex,
    roll
  ){

    try{

      await updateRoomOptimistic(
        currentRoomCode,
        current=>{

          if(
            current.status!=="playing" ||
            current.turn_index!==expectedTurnIndex
          ){
            return null;
          }

          const result=
            computeMove(
              mapRowToState(current),
              roll
            );

          return {

            players:
              result.players,

            turn_index:
              result.turnIndex,

            status:
              result.status,

            winner_id:
              result.winnerId,

            move_seq:
              result.moveSeq,

            last_move:
              result.lastMove
          };

        }
      );

    }catch(e){

      console.error(
        "move failed",
        e
      );
    }
  }

  /* =========================================================
     WIN SCREEN
     ========================================================= */

  function endGame(state){

    const overlay=
      document.getElementById(
        "winOverlay"
      );

    overlay.classList.remove(
      "hidden"
    );

    const winner=
      state.players.find(
        p=>p.id===state.winnerId
      );

    document.getElementById(
      "winText"
    ).textContent=
      winner
        ? `🏆 ${winner.name||("Seat "+winner.id)}${winner.isBot?" (Bot)":""} Wins! 🎉`
        : "🎉 Game Over 🎉";

    saveStats(winner);
  }

  async function saveStats(winner){

    if(
      !backendReady ||
      !sb
    ){
      return;
    }

    try{

      const {data:cur}=
        await sb
          .from("players")
          .select("*")
          .eq("uid",MY_UID)
          .maybeSingle();

      const iWon=
        winner &&
        winner.uid===MY_UID;

      await sb
        .from("players")
        .upsert(
          {
            uid:MY_UID,
            name:
              localStorage.getItem(
                "sl_name"
              ) || "Player",

            games_played:
              (cur?.games_played||0)+1,

            games_won:
              (cur?.games_won||0)+
              (iWon?1:0),

            last_played:
              Date.now()
          },
          {
            onConflict:"uid"
          }
        );

    }catch(e){

      console.warn(
        "stats save failed (non-fatal)",
        e
      );
    }
  }

  /* =========================================================
     RESET
     ========================================================= */

  document
    .getElementById("restartBtn")
    .addEventListener(
      "click",
      resetToHome
    );

  document
    .getElementById("playAgainBtn")
    .addEventListener(
      "click",
      resetToHome
    );

  function resetToHome(){

    leaveLobby();

    mode=null;
    localState=null;
    onlineGameState=null;

    document
      .getElementById("winOverlay")
      .classList
      .add("hidden");

    document
      .getElementById("diceBox")
      .classList
      .remove("rolling");

    document.getElementById(
      "diceBox"
    ).textContent="🎲";

    showScreen("home");
  }

  /* =========================================================
     MOBILE DOUBLE-TAP ZOOM PREVENTION
     ========================================================= */

  document.addEventListener(
    "dblclick",
    e=>e.preventDefault()
  );

})();
</script>
