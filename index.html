<style>
/* =========================================================
   🐍 SNAKES & LADDERS — PREMIUM UI UPGRADE
   CSS ONLY — existing HTML/JS IDs and classes preserved
   ========================================================= */

:root{
  --bg:#020617;
  --bg-soft:#0f172a;
  --panel:rgba(15,23,42,.82);
  --panel-light:rgba(30,41,59,.72);

  --cyan:#22d3ee;
  --cyan-dark:#0891b2;
  --orange:#fb923c;
  --orange-dark:#ea580c;

  --white:#f8fafc;
  --text:#e2e8f0;
  --muted:#94a3b8;

  --green:#22c55e;
  --red:#ef4444;
  --blue:#3b82f6;
  --yellow:#eab308;

  --wood1:#c47a3a;
  --wood2:#6f3f18;

  --shadow:0 20px 50px rgba(0,0,0,.45);
  --soft-shadow:0 8px 25px rgba(0,0,0,.3);

  --radius:18px;
}

/* =========================
   GLOBAL
   ========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:
    Inter,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  color:var(--white);

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(34,211,238,.14),
      transparent 35%
    ),
    radial-gradient(
      circle at 0% 30%,
      rgba(249,115,22,.08),
      transparent 30%
    ),
    linear-gradient(
      160deg,
      #0f172a 0%,
      #020617 55%,
      #000 100%
    );

  min-height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));

  -webkit-font-smoothing:antialiased;
}

button,
input{
  font-family:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

.hidden{
  display:none !important;
}

/* =========================
   HEADINGS
   ========================= */

h1{
  position:relative;

  font-size:clamp(1.5rem,6vw,2.1rem);
  line-height:1.1;

  margin:8px 0 8px;

  letter-spacing:1.5px;
  font-weight:950;

  text-align:center;

  background:
    linear-gradient(
      100deg,
      #67e8f9 0%,
      var(--cyan) 35%,
      #fbbf24 70%,
      var(--orange) 100%
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  filter:
    drop-shadow(0 4px 15px rgba(34,211,238,.16));
}

h1::after{
  content:"";

  display:block;

  width:55px;
  height:3px;

  margin:8px auto 0;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      var(--cyan),
      var(--orange)
    );

  box-shadow:
    0 0 15px rgba(34,211,238,.45);
}

h2.subtitle{
  font-size:.88rem;
  line-height:1.5;

  color:var(--muted);

  margin:0 0 18px;

  text-align:center;

  font-weight:500;
}

/* =========================
   CARD / PANELS
   ========================= */

.card{
  position:relative;

  width:100%;
  max-width:430px;

  padding:22px;

  border-radius:var(--radius);

  background:
    linear-gradient(
      145deg,
      rgba(30,41,59,.88),
      rgba(2,6,23,.82)
    );

  border:1px solid rgba(148,163,184,.12);

  box-shadow:var(--shadow);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  overflow:hidden;
}

.card::before{
  content:"";

  position:absolute;

  top:0;
  left:10%;
  right:10%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(34,211,238,.65),
      transparent
    );

  opacity:.8;
}

/* =========================
   BACK BUTTON
   ========================= */

.backLink{
  display:inline-flex;
  align-items:center;
  gap:6px;

  background:none;
  border:none;

  color:var(--muted);

  font-size:.82rem;
  font-weight:650;

  cursor:pointer;

  margin-bottom:12px;
  padding:6px 4px;

  transition:
    color .2s ease,
    transform .2s ease;
}

.backLink:hover{
  color:var(--cyan);
  transform:translateX(-2px);
}

.backLink:active{
  transform:scale(.96);
}

/* =========================
   LARGE MODE BUTTONS
   ========================= */

.big-btn{
  position:relative;

  width:100%;

  min-height:76px;

  padding:16px 18px;

  margin-bottom:12px;

  border:1px solid rgba(255,255,255,.08);

  border-radius:16px;

  font-weight:850;
  font-size:1rem;

  cursor:pointer;
  text-align:left;

  display:flex;
  align-items:center;

  gap:14px;

  color:#fff;

  overflow:hidden;

  box-shadow:
    0 10px 25px rgba(0,0,0,.25);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

.big-btn::before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 20%,
      rgba(255,255,255,.13) 50%,
      transparent 80%
    );

  transform:translateX(-120%);

  transition:transform .55s ease;
}

.big-btn:hover::before{
  transform:translateX(120%);
}

.big-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px rgba(0,0,0,.38);
  filter:brightness(1.06);
}

.big-btn:active{
  transform:translateY(1px) scale(.985);
}

.big-btn .emoji{
  position:relative;

  width:48px;
  height:48px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:rgba(255,255,255,.13);

  font-size:1.65rem;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15);
}

.big-btn small{
  display:block;

  font-weight:500;

  opacity:.78;

  font-size:.72rem;

  margin-top:4px;

  line-height:1.35;
}

#btnLocal{
  background:
    linear-gradient(
      135deg,
      #0ea5e9,
      #0369a1
    );

  box-shadow:
    0 10px 28px rgba(14,165,233,.22);
}

#btnOnline{
  background:
    linear-gradient(
      135deg,
      #fb923c,
      #c2410c
    );

  box-shadow:
    0 10px 28px rgba(249,115,22,.22);
}

/* =========================
   SETUP
   ========================= */

.setup-row{
  margin-bottom:20px;
}

.setup-row label{
  display:flex;
  align-items:center;

  font-size:.78rem;
  font-weight:750;

  color:#cbd5e1;

  margin-bottom:9px;

  letter-spacing:.25px;
}

.choice-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.choice-btn{
  flex:1;

  min-width:58px;

  padding:11px 8px;

  border-radius:12px;

  border:1px solid #334155;

  background:
    linear-gradient(
      145deg,
      #111827,
      #0f172a
    );

  color:var(--text);

  font-size:.9rem;
  font-weight:750;

  cursor:pointer;

  transition:
    border-color .2s ease,
    background .2s ease,
    transform .15s ease,
    box-shadow .2s ease;
}

.choice-btn:hover{
  border-color:#64748b;
}

.choice-btn:active{
  transform:scale(.96);
}

.choice-btn.active{
  border-color:var(--cyan);

  background:
    linear-gradient(
      145deg,
      #083344,
      #164e63
    );

  color:#67e8f9;

  box-shadow:
    0 0 0 1px rgba(34,211,238,.08),
    0 5px 18px rgba(34,211,238,.14);
}

/* =========================
   DIFFICULTY BUTTONS
   ========================= */

.mode-btn{
  position:relative;

  width:100%;

  padding:14px 15px;

  border-radius:13px;

  border:1px solid #334155;

  background:
    linear-gradient(
      145deg,
      #111827,
      #0b1220
    );

  color:var(--light);

  font-weight:800;

  margin-bottom:9px;

  cursor:pointer;

  font-size:.88rem;

  text-align:left;

  transition:
    transform .18s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.mode-btn:hover{
  transform:translateY(-1px);
  border-color:#64748b;
}

.mode-btn small{
  display:block;

  font-weight:500;

  color:var(--muted);

  font-size:.7rem;

  line-height:1.4;

  margin-top:4px;
}

.mode-btn.active.normal{
  border-color:var(--green);

  background:
    linear-gradient(
      145deg,
      #052e16,
      #064e3b
    );

  box-shadow:
    0 8px 22px rgba(34,197,94,.13);
}

.mode-btn.active.hard{
  border-color:var(--red);

  background:
    linear-gradient(
      145deg,
      #2a0a0a,
      #450a0a
    );

  box-shadow:
    0 8px 22px rgba(239,68,68,.14);
}

/* =========================
   INPUTS
   ========================= */

input[type=text]{
  width:100%;

  padding:13px 14px;

  border-radius:12px;

  border:1px solid #334155;

  outline:none;

  background:
    rgba(2,6,23,.72);

  color:var(--light);

  font-size:.95rem;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input[type=text]::placeholder{
  color:#64748b;
}

input[type=text]:focus{
  border-color:var(--cyan);

  background:#020617;

  box-shadow:
    0 0 0 3px rgba(34,211,238,.10),
    0 5px 18px rgba(0,0,0,.2);
}

input#joinCode{
  text-transform:uppercase;

  letter-spacing:5px;

  text-align:center;

  font-weight:900;

  font-size:1.25rem;

  padding:15px;
}

/* =========================
   PRIMARY BUTTON
   ========================= */

.primary-btn{
  position:relative;

  width:100%;

  padding:14px 16px;

  margin-top:10px;

  border:none;

  border-radius:13px;

  background:
    linear-gradient(
      100deg,
      var(--cyan),
      #06b6d4
    );

  color:#042f36;

  font-weight:900;

  font-size:.98rem;

  cursor:pointer;

  box-shadow:
    0 8px 22px rgba(34,211,238,.22);

  transition:
    transform .16s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.primary-btn:hover{
  transform:translateY(-2px);

  filter:brightness(1.07);

  box-shadow:
    0 12px 28px rgba(34,211,238,.3);
}

.primary-btn:active{
  transform:translateY(1px) scale(.985);
}

.primary-btn:disabled{
  opacity:.38;
  cursor:not-allowed;
  box-shadow:none;
}

/* =========================
   HINT / ERROR
   ========================= */

.hint{
  font-size:.7rem;

  color:var(--muted);

  margin-top:7px;

  line-height:1.5;
}

.errorMsg{
  color:#f87171;

  font-size:.78rem;

  margin-top:8px;

  min-height:16px;

  line-height:1.4;
}

/* =========================
   ROOM CODE
   ========================= */

#roomCodeBig{
  position:relative;

  font-size:clamp(1.9rem,9vw,2.5rem);

  font-weight:950;

  letter-spacing:7px;

  text-align:center;

  color:#67e8f9;

  background:
    linear-gradient(
      145deg,
      #07111f,
      #0b1729
    );

  border-radius:15px;

  padding:17px 12px;

  margin-bottom:15px;

  border:1px dashed rgba(34,211,238,.5);

  box-shadow:
    inset 0 0 25px rgba(34,211,238,.04),
    0 8px 25px rgba(0,0,0,.25);
}

#roomCodeBig::before{
  content:"ROOM CODE";

  display:block;

  font-size:.58rem;

  letter-spacing:2px;

  color:#64748b;

  margin-bottom:4px;

  font-weight:800;
}

/* =========================
   LOBBY
   ========================= */

.lobbyList{
  list-style:none;

  padding:0;

  margin:0 0 15px;
}

.lobbyList li{
  display:flex;

  align-items:center;

  gap:10px;

  padding:11px 12px;

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(15,23,42,.95),
      rgba(11,18,32,.95)
    );

  border:1px solid rgba(148,163,184,.08);

  margin-bottom:7px;

  font-size:.8rem;

  box-shadow:
    0 4px 12px rgba(0,0,0,.15);
}

.lobbyList .dot{
  width:11px;
  height:11px;

  border-radius:50%;

  flex-shrink:0;

  box-shadow:
    0 0 8px currentColor;
}

.lobbyList .tag{
  margin-left:auto;

  font-size:.64rem;

  color:var(--muted);

  padding:3px 7px;

  border-radius:999px;

  background:rgba(148,163,184,.08);
}

/* =========================
   GAME CONTAINER
   ========================= */

#game{
  width:100%;

  max-width:540px;

  display:flex;

  flex-direction:column;

  align-items:center;
}

/* =========================
   TOP BAR
   ========================= */

#topbar{
  width:100%;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;

  margin-bottom:10px;

  font-size:.75rem;

  color:var(--muted);
}

#topbar button{
  background:
    rgba(30,41,59,.9);

  border:1px solid #334155;

  color:var(--light);

  padding:7px 11px;

  border-radius:9px;

  font-size:.68rem;

  font-weight:700;

  cursor:pointer;

  transition:
    background .2s ease,
    border-color .2s ease,
    transform .15s ease;
}

#topbar button:hover{
  background:#334155;
  border-color:#64748b;
}

#topbar button:active{
  transform:scale(.95);
}

/* =========================
   MODE / ROOM TAGS
   ========================= */

#modeTag,
#roomTag{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:4px 10px;

  border-radius:999px;

  font-weight:850;

  font-size:.62rem;

  white-space:nowrap;
}

#modeTag.normal{
  background:rgba(34,197,94,.12);
  color:#4ade80;
  border:1px solid rgba(34,197,94,.2);
}

#modeTag.hard{
  background:rgba(239,68,68,.12);
  color:#f87171;
  border:1px solid rgba(239,68,68,.2);
}

#roomTag{
  background:rgba(14,165,233,.12);

  color:#38bdf8;

  border:1px solid rgba(56,189,248,.2);
}

/* =========================
   PLAYERS
   ========================= */

#players{
  display:flex;

  gap:6px;

  width:100%;

  margin-bottom:10px;

  flex-wrap:wrap;

  justify-content:center;
}

.pchip{
  display:flex;

  align-items:center;

  gap:6px;

  background:
    rgba(15,23,42,.85);

  border:1px solid rgba(148,163,184,.12);

  border-radius:10px;

  padding:6px 9px;

  font-size:.68rem;

  font-weight:700;

  opacity:.48;

  transition:
    opacity .2s ease,
    transform .2s ease,
    border-color .2s ease;
}

.pchip.active{
  opacity:1;

  border-color:var(--cyan);

  background:
    rgba(8,51,68,.72);

  box-shadow:
    0 0 0 1px rgba(34,211,238,.08),
    0 0 16px rgba(34,211,238,.15);

  transform:translateY(-1px);
}

.pchip.done{
  opacity:.3;
}

.dot{
  width:11px;
  height:11px;

  border-radius:50%;

  flex-shrink:0;
}

.pchip .pos{
  color:var(--muted);

  font-variant-numeric:tabular-nums;
}

/* =========================
   GAME BOARD
   ========================= */

#boardWrap{
  width:100%;

  aspect-ratio:1/1;

  max-width:520px;

  position:relative;

  border-radius:18px;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      var(--wood1),
      var(--wood2)
    );

  padding:7px;

  box-shadow:
    0 18px 45px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.08);

  isolation:isolate;
}

#boardWrap::before{
  content:"";

  position:absolute;

  inset:3px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,.15);

  pointer-events:none;

  z-index:5;
}

#board{
  display:grid;

  grid-template-columns:repeat(10,1fr);
  grid-template-rows:repeat(10,1fr);

  width:100%;
  height:100%;

  position:relative;

  z-index:1;

  overflow:hidden;

  border-radius:11px;
}

/* =========================
   BOARD CELLS
   ========================= */

.cell{
  position:relative;

  display:flex;

  align-items:flex-start;
  justify-content:flex-start;

  font-size:clamp(.48rem,1.8vw,.68rem);

  font-weight:900;

  padding:4px;

  overflow:hidden;

  border-right:1px solid rgba(74,52,24,.10);
  border-bottom:1px solid rgba(74,52,24,.10);

  transition:
    filter .2s ease;
}

.cell:hover{
  filter:brightness(1.05);
}

.cell.even{
  background:
    linear-gradient(
      145deg,
      #fff7df,
      #ead9b1
    );

  color:#4a3418;
}

.cell.odd{
  background:
    linear-gradient(
      145deg,
      #e5cc95,
      #cdb274
    );

  color:#4a3418;
}

.cell.start{
  background:
    linear-gradient(
      145deg,
      #bbf7d0,
      #22c55e
    );

  color:#052e16;

  box-shadow:
    inset 0 0 15px rgba(255,255,255,.22);
}

.cell.finish{
  background:
    linear-gradient(
      145deg,
      #fef3c7,
      #f59e0b
    );

  color:#451a03;

  box-shadow:
    inset 0 0 15px rgba(255,255,255,.22);
}

.cell.snake-cell::after{
  content:"🐍";

  position:absolute;

  right:2px;
  bottom:1px;

  font-size:clamp(.55rem,2vw,.8rem);

  opacity:.62;

  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,.18));
}

.cell.ladder-cell::after{
  content:"🪜";

  position:absolute;

  right:2px;
  bottom:1px;

  font-size:clamp(.55rem,2vw,.8rem);

  opacity:.62;

  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,.18));
}

/* =========================
   SNAKES / LADDERS SVG
   ========================= */

#svgOverlay{
  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;

  width:100%;
  height:100%;
}

/* =========================
   TOKENS
   ========================= */

.tokens-layer{
  position:absolute;

  inset:0;

  z-index:3;

  pointer-events:none;
}

.token{
  position:absolute;

  width:9.5%;
  height:9.5%;

  border-radius:50%;

  border:2.5px solid rgba(255,255,255,.95);

  box-shadow:
    0 4px 10px rgba(0,0,0,.55),
    inset 0 2px 3px rgba(255,255,255,.35);

  transition:
    left .32s cubic-bezier(.22,.61,.36,1),
    top .32s cubic-bezier(.22,.61,.36,1),
    transform .2s ease;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:clamp(.5rem,2vw,.68rem);

  font-weight:950;

  color:#fff;

  text-shadow:
    0 1px 2px rgba(0,0,0,.5);
}

.token:hover{
  transform:scale(1.08);
}

/* =========================
   CONTROLS
   ========================= */

#controls{
  width:100%;

  max-width:520px;

  display:flex;

  align-items:center;

  gap:13px;

  margin-top:15px;

  justify-content:center;

  padding:2px;
}

/* =========================
   DICE
   ========================= */

#diceBox{
  width:64px;
  height:64px;

  flex-shrink:0;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #dbeafe
    );

  border-radius:16px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:1.9rem;

  font-weight:950;

  color:#111827;

  box-shadow:
    0 10px 22px rgba(0,0,0,.4),
    inset 0 1px 2px rgba(255,255,255,.9);

  user-select:none;

  border:1px solid rgba(255,255,255,.7);
}

#diceBox.rolling{
  animation:
    diceShake .45s infinite;
}

@keyframes diceShake{
  0%,100%{
    transform:rotate(0) scale(1);
  }

  25%{
    transform:rotate(-12deg) scale(1.04);
  }

  50%{
    transform:rotate(0) scale(1.08);
  }

  75%{
    transform:rotate(12deg) scale(1.04);
  }
}

/* =========================
   ROLL BUTTON
   ========================= */

#rollBtn{
  flex:1;

  min-height:60px;

  padding:15px 22px;

  border:none;

  border-radius:16px;

  font-weight:950;

  font-size:1rem;

  letter-spacing:.2px;

  background:
    linear-gradient(
      100deg,
      var(--orange),
      #f97316,
      #ea580c
    );

  color:#2b0d00;

  cursor:pointer;

  box-shadow:
    0 10px 24px rgba(249,115,22,.25);

  transition:
    transform .16s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

#rollBtn:hover{
  transform:translateY(-2px);

  filter:brightness(1.07);

  box-shadow:
    0 14px 30px rgba(249,115,22,.34);
}

#rollBtn:active{
  transform:translateY(1px) scale(.985);
}

#rollBtn:disabled{
  opacity:.38;

  cursor:default;

  transform:none;

  box-shadow:none;
}

/* =========================
   TURN MESSAGE
   ========================= */

#turnMsg{
  width:100%;

  max-width:520px;

  text-align:center;

  margin-top:10px;

  min-height:22px;

  font-size:.8rem;

  font-weight:650;

  color:#cbd5e1;

  padding:4px 8px;

  line-height:1.4;
}

/* =========================
   GAME LOG
   ========================= */

#log{
  width:100%;

  max-width:520px;

  margin-top:9px;

  background:
    linear-gradient(
      145deg,
      rgba(11,18,32,.95),
      rgba(2,6,23,.95)
    );

  border:1px solid rgba(148,163,184,.08);

  border-radius:12px;

  padding:9px 11px;

  font-size:.68rem;

  line-height:1.55;

  color:#94a3b8;

  max-height:95px;

  overflow-y:auto;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.02);
}

#log::-webkit-scrollbar{
  width:4px;
}

#log::-webkit-scrollbar-track{
  background:transparent;
}

#log::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:999px;
}

/* =========================
   WIN SCREEN
   ========================= */

#winOverlay{
  position:fixed;

  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(15,23,42,.72),
      rgba(0,0,0,.92)
    );

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:50;

  flex-direction:column;

  gap:17px;

  text-align:center;

  padding:24px;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

#winOverlay h2{
  font-size:clamp(1.5rem,7vw,2rem);

  margin:0;

  font-weight:950;

  background:
    linear-gradient(
      90deg,
      var(--cyan),
      #fff,
      var(--orange)
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:
    drop-shadow(0 5px 20px rgba(34,211,238,.18));
}

#winOverlay button{
  padding:13px 26px;

  border-radius:13px;

  border:none;

  font-weight:900;

  font-size:.92rem;

  background:
    linear-gradient(
      100deg,
      var(--cyan),
      #06b6d4
    );

  color:#042f36;

  cursor:pointer;

  box-shadow:
    0 10px 25px rgba(34,211,238,.25);

  transition:
    transform .16s ease,
    filter .2s ease;
}

#winOverlay button:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

#winOverlay button:active{
  transform:scale(.97);
}

/* =========================
   MOBILE OPTIMIZATION
   ========================= */

@media (max-width:480px){

  body{
    padding-left:9px;
    padding-right:9px;
  }

  .card{
    padding:17px;
    border-radius:16px;
  }

  h1{
    font-size:1.45rem;
  }

  h2.subtitle{
    font-size:.82rem;
  }

  #boardWrap{
    padding:6px;
    border-radius:16px;
  }

  #controls{
    gap:10px;
  }

  #diceBox{
    width:58px;
    height:58px;

    border-radius:14px;

    font-size:1.65rem;
  }

  #rollBtn{
    min-height:58px;

    padding:14px 16px;

    font-size:.92rem;
  }

  .pchip{
    padding:5px 7px;
    font-size:.64rem;
  }

  .token{
    border-width:2px;
  }
}

/* =========================
   VERY SMALL PHONES
   ========================= */

@media (max-width:360px){

  .card{
    padding:14px;
  }

  .big-btn{
    min-height:68px;
    padding:13px;
  }

  .big-btn .emoji{
    width:42px;
    height:42px;
    font-size:1.4rem;
  }

  #diceBox{
    width:54px;
    height:54px;
  }

  #rollBtn{
    min-height:54px;
    font-size:.86rem;
  }
}

/* =========================
   ACCESSIBILITY
   ========================= */

button:focus-visible,
input:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

/* =========================
   REDUCED MOTION
   ========================= */

@media (prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<h1>🐍 SNAKES &amp; LADDERS 🪜</h1>

<div id="home" class="card">
  <h2 class="subtitle">How do you want to play?</h2>
  <button class="big-btn" id="btnLocal"><span class="emoji">📱</span>
    <span>Face-to-Face<small>Pass one phone around · 2-4 players + bots</small></span>
  </button>
  <button class="big-btn" id="btnOnline"><span class="emoji">🌐</span>
    <span>Play Online<small>Share a room code · play from separate phones</small></span>
  </button>
  <div class="hint" id="backendStatus"></div>
</div>

<div id="localSetup" class="card hidden">
  <button class="backLink" data-back="home">‹ Back</button>
  <div class="setup-row">
    <label>Total players (2-4)</label>
    <div class="choice-group" id="totalGroup">
      <button class="choice-btn" data-val="2">2</button>
      <button class="choice-btn" data-val="3">3</button>
      <button class="choice-btn" data-val="4">4</button>
    </div>
  </div>
  <div class="setup-row">
    <label>Human players</label>
    <div class="choice-group" id="humanGroup"></div>
    <div class="hint">Remaining slots are filled by computer bots.</div>
  </div>
  <div class="setup-row">
    <label>Difficulty</label>
    <button class="mode-btn normal active" data-mode="normal" id="normalBtn">🙂 NORMAL
      <small>Friendly board · rolling a 6 always gives a bonus turn</small></button>
    <button class="mode-btn hard" data-mode="hard" id="hardBtn">🔥 HARD
      <small>Meaner snakes, exact roll needed to win, rolling a 6 only sometimes gives a bonus turn</small></button>
  </div>
  <button id="startLocalBtn" class="primary-btn">START GAME</button>
</div>

<div id="onlineHome" class="card hidden">
  <button class="backLink" data-back="home">‹ Back</button>
  <div class="setup-row">
    <label>Your name</label>
    <input type="text" id="playerName" maxlength="14" placeholder="e.g. Alex">
  </div>
  <button class="big-btn" id="btnCreateRoom" style="background:linear-gradient(135deg,#22c55e,#15803d);">
    <span class="emoji">➕</span><span>Create Room<small>Get a code to share with friends</small></span>
  </button>
  <button class="big-btn" id="btnJoinRoom" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9);">
    <span class="emoji">🔑</span><span>Join Room<small>Enter a code someone shared with you</small></span>
  </button>
  <div class="errorMsg" id="onlineHomeError"></div>
</div>

<div id="createForm" class="card hidden">
  <button class="backLink" data-back="onlineHome">‹ Back</button>
  <div class="setup-row">
    <label>Total players (2-4)</label>
    <div class="choice-group" id="totalGroupOnline">
      <button class="choice-btn" data-val="2">2</button>
      <button class="choice-btn" data-val="3">3</button>
      <button class="choice-btn" data-val="4">4</button>
    </div>
  </div>
  <div class="setup-row">
    <label>Human players (including you)</label>
    <div class="choice-group" id="humanGroupOnline"></div>
    <div class="hint">Open human slots wait for friends to join with the code. Empty ones can be filled with bots from the lobby.</div>
  </div>
  <div class="setup-row">
    <label>Difficulty</label>
    <button class="mode-btn normal active" data-mode="normal" id="normalBtnOnline">🙂 NORMAL
      <small>Friendly board · 6 always gives a bonus turn</small></button>
    <button class="mode-btn hard" data-mode="hard" id="hardBtnOnline">🔥 HARD
      <small>Meaner snakes, exact roll to win, 6 only sometimes gives a bonus turn</small></button>
  </div>
  <button id="createRoomBtn" class="primary-btn">CREATE ROOM</button>
  <div class="errorMsg" id="createError"></div>
</div>

<div id="joinForm" class="card hidden">
  <button class="backLink" data-back="onlineHome">‹ Back</button>
  <div class="setup-row">
    <label>Room code</label>
    <input type="text" id="joinCode" maxlength="5" placeholder="ABCDE">
  </div>
  <button id="joinRoomBtn" class="primary-btn">JOIN ROOM</button>
  <div class="errorMsg" id="joinError"></div>
</div>

<div id="lobby" class="card hidden">
  <button class="backLink" data-back="onlineHome" id="lobbyBack">‹ Leave</button>
  <h2 class="subtitle">Share this code:</h2>
  <div id="roomCodeBig">-----</div>
  <ul class="lobbyList" id="lobbyList"></ul>
  <button id="fillBotsBtn" class="primary-btn" style="background:linear-gradient(90deg,#64748b,#475569); color:#fff;">FILL EMPTY SEATS WITH BOTS</button>
  <button id="startOnlineBtn" class="primary-btn">START GAME</button>
  <div class="hint" id="lobbyHint"></div>
</div>

<div id="game" class="hidden">
  <div id="topbar">
    <span style="display:flex; gap:6px;">
      <span id="modeTag" class="normal">NORMAL</span>
      <span id="roomTag" class="hidden">ONLINE</span>
    </span>
    <button id="restartBtn">↺ Exit</button>
  </div>
  <div id="players"></div>
  <div id="boardWrap">
    <div id="board"></div>
    <svg id="svgOverlay" viewBox="0 0 500 500"></svg>
    <div class="tokens-layer" id="tokensLayer"></div>
  </div>
  <div id="controls">
    <div id="diceBox">🎲</div>
    <button id="rollBtn">ROLL DICE</button>
  </div>
  <div id="turnMsg">Ready</div>
  <div id="log"></div>
</div>

<div id="winOverlay" class="hidden">
  <h2 id="winText">🎉</h2>
  <button id="playAgainBtn">Back to Menu</button>
</div>

<script>
(function(){
  "use strict";

  /* ======================================================================
     SUPABASE CONFIG — replace with YOUR OWN project's URL + anon key.
     See README.md for step-by-step setup (create project, run the SQL,
     copy these two values from Project Settings → API).
     Until this is filled in, "Play Online" shows a friendly notice and
     only Face-to-Face mode works.
  ====================================================================== */
  const SUPABASE_CONFIG = {
    url: "https://gjyzkmnnbssmkqdopryy.supabase.co",       // e.g. "https://abcdefgh.supabase.co"
    anonKey: "sb_publishable_SCP7cbQXbShqS36x1NkAdQ_jkiKRhyp"
  };

  let sb = null;
  let backendReady = false;
  try{
    if(SUPABASE_CONFIG.url && SUPABASE_CONFIG.url !== "YOUR_SUPABASE_URL" &&
       SUPABASE_CONFIG.anonKey && SUPABASE_CONFIG.anonKey !== "YOUR_SUPABASE_ANON_KEY"){
      sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      backendReady = true;
    }
  }catch(e){ console.warn("Supabase init failed", e); }

  document.getElementById('backendStatus').textContent = backendReady
    ? ""
    : "ℹ️ Online play is enabled .";

  /* ---------------- IDENTITY (persisted locally) ---------------- */
  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);
    });
  }
  let MY_UID = localStorage.getItem('sl_uid');
  if(!MY_UID){ MY_UID = uuid(); localStorage.setItem('sl_uid', MY_UID); }

  /* ---------------- CONSTANTS ---------------- */
  const COLORS = {1:"var(--p1)",2:"var(--p2)",3:"var(--p3)",4:"var(--p4)"};
  const NAMES  = {1:"Red",2:"Blue",3:"Green",4:"Yellow"};

  const BOARDS = {
    normal:{
      ladders:{2:38,7:14,8:31,15:26,21:42,28:84,36:44,51:67,71:91,78:98,87:94},
      snakes:{16:6,46:25,49:11,62:19,64:60,74:53,89:68,92:88,95:75,99:78}
    },
    hard:{
      ladders:{4:14,9:29,20:38,40:59,51:67,63:81},
      snakes:{16:6,24:5,34:6,46:5,49:11,56:1,62:19,64:22,74:41,87:24,89:53,92:25,95:56,98:16,99:41}
    }
  };
  const HARD_SIX_BONUS_CHANCE = 0.3; // "a few chances" of a bonus turn on hard mode

  /* ---------------- NAVIGATION ---------------- */
  const SCREENS = ['home','localSetup','onlineHome','createForm','joinForm','lobby','game'];
  function showScreen(id){
    SCREENS.forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id));
  }
  document.querySelectorAll('.backLink').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.id==='lobbyBack') leaveLobby();
      showScreen(b.dataset.back);
    });
  });
  document.getElementById('btnLocal').addEventListener('click', ()=>showScreen('localSetup'));
  document.getElementById('btnOnline').addEventListener('click', ()=>{
    document.getElementById('onlineHomeError').textContent = backendReady ? "" :
      "Online play isn't configured yet — see README.md.";
    document.getElementById('playerName').value = localStorage.getItem('sl_name') || "";
    showScreen('onlineHome');
  });

  /* ================= LOCAL SETUP UI ================= */
  let localTotal = 2, localHumans = 2, localMode = "normal";
  const totalGroup = document.getElementById('totalGroup');
  const humanGroup = document.getElementById('humanGroup');

  function renderHumanChoices(group, total, current, onPick){
    group.innerHTML = "";
    for(let i=1;i<=total;i++){
      const b = document.createElement('button');
      b.className = 'choice-btn' + (i===current?' active':'');
      b.textContent = i===total ? `${i} (no bots)` : String(i);
      b.dataset.val = i;
      b.addEventListener('click', ()=>{
        onPick(i);
        [...group.children].forEach(c=>c.classList.remove('active'));
        b.classList.add('active');
      });
      group.appendChild(b);
    }
  }
  renderHumanChoices(humanGroup, localTotal, localHumans, v=>localHumans=v);
  [...totalGroup.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      [...totalGroup.children].forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      localTotal = parseInt(btn.dataset.val,10);
      if(localHumans>localTotal) localHumans = localTotal;
      renderHumanChoices(humanGroup, localTotal, localHumans, v=>localHumans=v);
    });
  });
  totalGroup.children[0].classList.add('active');

  document.getElementById('normalBtn').addEventListener('click', ()=>setLocalMode('normal'));
  document.getElementById('hardBtn').addEventListener('click', ()=>setLocalMode('hard'));
  function setLocalMode(m){
    localMode = m;
    document.getElementById('normalBtn').classList.toggle('active', m==='normal');
    document.getElementById('hardBtn').classList.toggle('active', m==='hard');
  }
  document.getElementById('startLocalBtn').addEventListener('click', ()=>{
    const players = [];
    for(let i=1;i<=localTotal;i++){
      players.push({id:i, uid:null, name:NAMES[i], isBot:i>localHumans, pos:0, finished:false});
    }
    startLocalGame(players, localMode);
  });

  /* ================= ONLINE SETUP UI ================= */
  let onlineTotal = 2, onlineHumans = 2, onlineMode = "normal";
  const totalGroupOnline = document.getElementById('totalGroupOnline');
  const humanGroupOnline = document.getElementById('humanGroupOnline');
  renderHumanChoices(humanGroupOnline, onlineTotal, onlineHumans, v=>onlineHumans=v);
  [...totalGroupOnline.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      [...totalGroupOnline.children].forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      onlineTotal = parseInt(btn.dataset.val,10);
      if(onlineHumans>onlineTotal) onlineHumans = onlineTotal;
      renderHumanChoices(humanGroupOnline, onlineTotal, onlineHumans, v=>onlineHumans=v);
    });
  });
  totalGroupOnline.children[0].classList.add('active');
  document.getElementById('normalBtnOnline').addEventListener('click', ()=>setOnlineMode('normal'));
  document.getElementById('hardBtnOnline').addEventListener('click', ()=>setOnlineMode('hard'));
  function setOnlineMode(m){
    onlineMode = m;
    document.getElementById('normalBtnOnline').classList.toggle('active', m==='normal');
    document.getElementById('hardBtnOnline').classList.toggle('active', m==='hard');
  }

  document.getElementById('btnCreateRoom').addEventListener('click', ()=>{ saveName(); showScreen('createForm'); });
  document.getElementById('btnJoinRoom').addEventListener('click', ()=>{ saveName(); showScreen('joinForm'); });
  function saveName(){
    const n = document.getElementById('playerName').value.trim();
    if(n) localStorage.setItem('sl_name', n);
  }
  function myName(){
    return (document.getElementById('playerName').value.trim() || localStorage.getItem('sl_name') || 'Player');
  }

  /* ================= ROOM CODE HELPERS ================= */
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function randomCode(){
    let c='';
    for(let i=0;i<5;i++) c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
    return c;
  }
  async function generateUniqueCode(){
    for(let tries=0; tries<6; tries++){
      const code = randomCode();
      const {data} = await sb.from('slgames').select('code').eq('code',code).maybeSingle();
      if(!data) return code;
    }
    return randomCode() + Math.floor(Math.random()*9);
  }

  /* ================= DB ROW <-> APP STATE MAPPING ================= */
  // DB columns are snake_case; internal game state stays camelCase everywhere else.
  function mapRowToState(row){
    return {
      mode: row.mode, total: row.total, hostUid: row.host_uid, status: row.status,
      turnIndex: row.turn_index, players: row.players, moveSeq: row.move_seq,
      lastMove: row.last_move, winnerId: row.winner_id, version: row.version
    };
  }

  /* ================= OPTIMISTIC-CONCURRENCY UPDATE HELPER =================
     Supabase/Postgres has no client-side transaction API like Firestore's
     runTransaction, so we emulate one: read the row, compute a patch, then
     write it back conditioned on the version column being unchanged. If
     another client updated first, the conditional UPDATE matches 0 rows
     and we retry. mutateFn may throw to abort with a specific error, or
     return null to signal "nothing to change". */
  async function updateRoomOptimistic(code, mutateFn, maxRetries=6){
    for(let i=0;i<maxRetries;i++){
      const {data:current, error} = await sb.from('slgames').select('*').eq('code',code).single();
      if(error || !current) throw new Error('NOTFOUND');
      const patch = mutateFn(current);
      if(patch===null) return current;
      const newVersion = (current.version||0)+1;
      const {data:updated, error:updErr} = await sb.from('slgames')
        .update({...patch, version:newVersion})
        .eq('code', code).eq('version', current.version||0)
        .select();
      if(updErr) throw updErr;
      if(updated && updated.length>0) return updated[0];
      // version mismatch -> someone else wrote first, retry
    }
    throw new Error('CONFLICT');
  }

  function attachRoomListener(code){
    if(roomChannel){ sb.removeChannel(roomChannel); roomChannel=null; }
    mode = 'online';
    let processedSeq = -1;
    let inGame = false;

    function handleRow(row){
      const state = mapRowToState(row);
      if(state.status === 'waiting'){ renderLobby(state); return; }
      if(!inGame){ inGame = true; enterOnlineGameScreen(state); processedSeq = -1; }
      handleOnlineSnapshot(state, processedSeq, seq=>processedSeq=seq);
    }

    sb.from('slgames').select('*').eq('code',code).single().then(({data,error})=>{
      if(error || !data){ alert("Room not found or closed."); showScreen('home'); return; }
      handleRow(data);
    });

    roomChannel = sb.channel('room_'+code)
      .on('postgres_changes', {event:'*', schema:'public', table:'slgames', filter:`code=eq.${code}`}, payload=>{
        if(payload.eventType==='DELETE'){ alert("Room closed."); showScreen('home'); leaveLobby(); return; }
        handleRow(payload.new);
      })
      .subscribe();
  }

  /* ======================================================================
     SHARED BOARD GEOMETRY / RENDERING (used by both local & online modes)
  ====================================================================== */
  function squareToRC(n){
    const idx = n-1;
    const rowFromBottom = Math.floor(idx/10);
    let col = idx % 10;
    if(rowFromBottom % 2 === 1) col = 9-col;
    const row = 9 - rowFromBottom;
    return {row,col};
  }
  function centerXY(n){
    const {row,col} = squareToRC(n);
    return {x: col*50+25, y: row*50+25};
  }

  let boardSnakes = {}, boardLadders = {};

  function buildBoardDOM(){
    const board = document.getElementById('board');
    board.innerHTML = "";
    for(let domRow=0; domRow<10; domRow++){
      for(let domCol=0; domCol<10; domCol++){
        const rowFromBottom = 9-domRow;
        let col = domCol;
        if(rowFromBottom % 2 === 1) col = 9-domCol;
        const num = rowFromBottom*10 + col + 1;
        const cell = document.createElement('div');
        let cls = 'cell ' + (((domRow+domCol)%2===0) ? 'even':'odd');
        if(num===1) cls += ' start';
        if(num===100) cls += ' finish';
        if(boardSnakes[num]) cls += ' snake-cell';
        if(boardLadders[num]) cls += ' ladder-cell';
        cell.className = cls;
        const span = document.createElement('span');
        span.textContent = num;
        cell.appendChild(span);
        board.appendChild(cell);
      }
    }
  }

  function drawOverlay(){
    const svg = document.getElementById('svgOverlay');
    svg.innerHTML = "";
    const ns = "http://www.w3.org/2000/svg";
    const defs = document.createElementNS(ns,'defs');
    svg.appendChild(defs);

    function addGradient(id, c1, c2){
      const g = document.createElementNS(ns,'linearGradient');
      g.setAttribute('id', id); g.setAttribute('x1','0%'); g.setAttribute('y1','0%');
      g.setAttribute('x2','100%'); g.setAttribute('y2','100%');
      const s1 = document.createElementNS(ns,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color',c1);
      const s2 = document.createElementNS(ns,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color',c2);
      g.appendChild(s1); g.appendChild(s2);
      defs.appendChild(g);
    }
    addGradient('snakeGrad', '#7f1d1d', '#f87171');
    addGradient('ladderGrad', '#fbbf24', '#92400e');

    function el(tag, attrs){
      const e = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
      svg.appendChild(e);
      return e;
    }

    Object.entries(boardLadders).forEach(([from,to])=>{
      const a = centerXY(parseInt(from,10)), b = centerXY(parseInt(to,10));
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
      const nx=-dy/len*7, ny=dx/len*7;
      el('line',{x1:a.x+nx,y1:a.y+ny,x2:b.x+nx,y2:b.y+ny,stroke:'url(#ladderGrad)','stroke-width':5,'stroke-linecap':'round'});
      el('line',{x1:a.x-nx,y1:a.y-ny,x2:b.x-nx,y2:b.y-ny,stroke:'url(#ladderGrad)','stroke-width':5,'stroke-linecap':'round'});
      const steps = Math.max(4, Math.round(len/20));
      for(let i=1;i<steps;i++){
        const px=a.x+dx*i/steps, py=a.y+dy*i/steps;
        el('line',{x1:px+nx,y1:py+ny,x2:px-nx,y2:py-ny,stroke:'#78350f','stroke-width':3.5,'stroke-linecap':'round'});
      }
    });

    Object.entries(boardSnakes).forEach(([from,to])=>{
      const a = centerXY(parseInt(from,10)), b = centerXY(parseInt(to,10));
      const dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy);
      const nx=-dy/dist, ny=dx/dist;
      const wave = Math.min(26, dist*0.16) * (((parseInt(from,10)+parseInt(to,10))%2===0)?1:-1);
      const p1 = {x:a.x+dx*0.33+nx*wave, y:a.y+dy*0.33+ny*wave};
      const p2 = {x:a.x+dx*0.66-nx*wave, y:a.y+dy*0.66-ny*wave};
      const d = `M ${a.x} ${a.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${b.x} ${b.y}`;
      el('path',{d, stroke:'url(#snakeGrad)','stroke-width':8,fill:'none','stroke-linecap':'round'});
      el('path',{d, stroke:'#00000030','stroke-width':8,fill:'none','stroke-linecap':'round','stroke-dasharray':'3 7'});
      el('circle',{cx:b.x, cy:b.y, r:3, fill:'#7f1d1d'});
      el('ellipse',{cx:a.x, cy:a.y, rx:9, ry:7, fill:'#b91c1c', stroke:'#450a0a','stroke-width':1.5});
      const hx = -dy/dist, hy = dx/dist;
      el('circle',{cx:a.x+hx*4-dx/dist*2, cy:a.y+hy*4-dy/dist*2, r:1.6, fill:'#fff'});
      el('circle',{cx:a.x-hx*4-dx/dist*2, cy:a.y-hy*4-dy/dist*2, r:1.6, fill:'#fff'});
      el('circle',{cx:a.x+hx*4-dx/dist*2, cy:a.y+hy*4-dy/dist*2, r:0.8, fill:'#000'});
      el('circle',{cx:a.x-hx*4-dx/dist*2, cy:a.y-hy*4-dy/dist*2, r:0.8, fill:'#000'});
      const fx1 = a.x-dx/dist*12+hx*2.5, fy1 = a.y-dy/dist*12+hy*2.5;
      const fx2 = a.x-dx/dist*12-hx*2.5, fy2 = a.y-dy/dist*12-hy*2.5;
      el('line',{x1:a.x-dx/dist*8, y1:a.y-dy/dist*8, x2:fx1, y2:fy1, stroke:'#450a0a','stroke-width':1});
      el('line',{x1:a.x-dx/dist*8, y1:a.y-dy/dist*8, x2:fx2, y2:fy2, stroke:'#450a0a','stroke-width':1});
    });
  }

  function renderTokens(players){

    players.forEach(p=>{

      byPos[p.pos] = byPos[p.pos]||[];

    });
    Object.entries(byPos).forEach(([pos, plist])=>{

  /* ======================================================================
     PURE GAME ENGINE — same function drives local & online play
  ====================================================================== */
  function computeMove(gameState, roll){
    const players = gameState.players.map(p=>({...p}));
    const pIdx = gameState.turnIndex;
    const p = players[pIdx];
    const from = p.pos;
    const isHard = gameState.mode === 'hard';
    let landed = from + roll;
    let overshoot = false;

    if(landed > 100){
      if(isHard){ overshoot = true; landed = from; }
      else { landed = 100 - (landed-100); }
    }

    let snake=null, ladder=null, finishedNow=false;
    let finalPos = landed;
    if(!overshoot){
      if(boardSnakes[landed]){ snake={from:landed, to:boardSnakes[landed]}; finalPos=boardSnakes[landed]; }
      else if(boardLadders[landed]){ ladder={from:landed, to:boardLadders[landed]}; finalPos=boardLadders[landed]; }
    }
    p.pos = finalPos;
    if(finalPos===100){ p.finished = true; finishedNow = true; }
    players[pIdx] = p;

    let bonus = false;
    if(!p.finished && roll===6){
      bonus = isHard ? (Math.random() < HARD_SIX_BONUS_CHANCE) : true;
    }

    let turnIndex = gameState.turnIndex;
    let status = gameState.status;
    let winnerId = gameState.winnerId || null;

    if(finishedNow){
      status = 'finished';
      winnerId = p.id;
    } else if(!bonus){
      let next = turnIndex;
      for(let i=0;i<players.length;i++){
        next = (next+1) % players.length;
        if(!players[next].finished) break;
      }
      turnIndex = next;
    }

    const lastMove = {
      seq: (gameState.moveSeq||0) + 1,
      playerId: p.id,
      from, to: landed, roll, snake, ladder, finishedNow, bonus, overshoot
    };

    return { players, turnIndex, status, winnerId, moveSeq: lastMove.seq, lastMove };
  }

  function playMoveAnimation(finalPlayers, lastMove, onDone){
    const activePlayer = finalPlayers.find(p=>p.id===lastMove.playerId);
    const working = finalPlayers.map(p=> p.id===lastMove.playerId ? {...p, pos:lastMove.from} : p);
    const activeIdx = working.findIndex(p=>p.id===lastMove.playerId);
    let cur = lastMove.from;
    const target = lastMove.overshoot ? lastMove.from : lastMove.to;
    const dir = target>cur ? 1 : -1;

    logMsg(`${activePlayer.name||('Seat '+activePlayer.id)} rolled ${lastMove.roll}`);

    function step(){
      if(cur===target){ afterMain(); return; }
      cur += dir;
      working[activeIdx] = {...working[activeIdx], pos:cur};
      renderTokens(working);
      setTimeout(step, 150);
    }
    function afterMain(){
      if(lastMove.snake){
        setTurnMessage(`🐍 ${activePlayer.name} bitten by a snake! ${lastMove.snake.from} → ${lastMove.snake.to}`);
        logMsg(`🐍 Snake: ${lastMove.snake.from} → ${lastMove.snake.to}`);
        setTimeout(()=>{
          working[activeIdx] = {...working[activeIdx], pos:lastMove.snake.to};
          renderTokens(working);
          setTimeout(onDone, 350);
        }, 400);
      } else if(lastMove.ladder){
        setTurnMessage(`🪜 ${activePlayer.name} climbs a ladder! ${lastMove.ladder.from} → ${lastMove.ladder.to}`);
        logMsg(`🪜 Ladder: ${lastMove.ladder.from} → ${lastMove.ladder.to}`);
        setTimeout(()=>{
          working[activeIdx] = {...working[activeIdx], pos:lastMove.ladder.to};
          renderTokens(working);
          setTimeout(onDone, 350);
        }, 400);
      } else if(lastMove.overshoot){
        setTurnMessage(`${activePlayer.name} rolled ${lastMove.roll} but overshot 100! Stays put.`);
        setTimeout(onDone, 300);
      } else {
        setTimeout(onDone, 150);
      }
    }
    step();
  }

  function rollDiceAnimated(cb){
    const dice = document.getElementById('diceBox');
    dice.classList.add('rolling');
    let ticks = 0;
    const spin = setInterval(()=>{
      dice.textContent = 1+Math.floor(Math.random()*6);
      ticks++;
      if(ticks>6){
        clearInterval(spin);
        const roll = 1+Math.floor(Math.random()*6);
        dice.textContent = roll;
        dice.classList.remove('rolling');
        cb(roll);
      }
    },70);
  }

  /* ======================================================================
     LOCAL (PASS & PLAY) DRIVER
  ====================================================================== */
  let mode = null; // 'local' | 'online'
  let localState = null;

  function startLocalGame(players, gameMode){
    mode = 'local';
    boardSnakes = BOARDS[gameMode].snakes;
    boardLadders = BOARDS[gameMode].ladders;
    localState = { mode:gameMode, players, turnIndex:0, status:'playing', winnerId:null, moveSeq:0 };

    showScreen('game');
    document.getElementById('roomTag').classList.add('hidden');
    document.getElementById('modeTag').textContent = gameMode==='hard'?'HARD':'NORMAL';
    document.getElementById('modeTag').className = gameMode==='hard'?'hard':'normal';
    document.getElementById('log').innerHTML = "";
    document.getElementById('winOverlay').classList.add('hidden');

    buildBoardDOM(); drawOverlay();
    renderPlayers(localState); renderTokens(localState.players);
    setTurnMessage(`${localState.players[0].name}'s turn`);
    updateLocalRollButton();
    maybeAutoRollLocalBot();
  }

  function updateLocalRollButton(){
    const btn = document.getElementById('rollBtn');
    const cp = localState.players[localState.turnIndex];
    btn.disabled = cp.isBot;
    btn.textContent = cp.isBot ? `${cp.name} (bot) rolling…` : 'ROLL DICE';
  }

  function maybeAutoRollLocalBot(){
    const cp = localState.players[localState.turnIndex];
    if(cp.isBot && localState.status==='playing'){
      setTimeout(()=>doLocalRoll(), 700);
    }
  }

  document.getElementById('rollBtn').addEventListener('click', ()=>{
    if(mode!=='local') return;
    const cp = localState.players[localState.turnIndex];
    if(cp.isBot) return;
    doLocalRoll();
  });

  let localBusy = false;
  function doLocalRoll(){
    if(localBusy) return;
    localBusy = true;
    document.getElementById('rollBtn').disabled = true;
    rollDiceAnimated(roll=>{
      const result = computeMove(localState, roll);
      playMoveAnimation(result.players, result.lastMove, ()=>{
        localState = { ...localState, players:result.players, turnIndex:result.turnIndex,
          status:result.status, winnerId:result.winnerId, moveSeq:result.moveSeq };
        renderPlayers(localState); renderTokens(localState.players);
        localBusy = false;
        if(localState.status==='finished'){
          endGame(localState);
        } else {
          if(result.lastMove.bonus) setTurnMessage(`🎲 Rolled a 6 — go again!`);
          else setTurnMessage(`${localState.players[localState.turnIndex].name}'s turn`);
          updateLocalRollButton();
          maybeAutoRollLocalBot();
        }
      });
    });
  }

  /* ======================================================================
     ONLINE DRIVER
  ====================================================================== */
  let onlineGameState = null; // authoritative, at-rest
  let onlineBusy = false;

  function enterOnlineGameScreen(state){
    boardSnakes = BOARDS[state.mode].snakes;
    boardLadders = BOARDS[state.mode].ladders;
    showScreen('game');
    document.getElementById('roomTag').classList.remove('hidden');
    document.getElementById('roomTag').textContent = 'ROOM ' + currentRoomCode;
    document.getElementById('modeTag').textContent = state.mode==='hard'?'HARD':'NORMAL';
    document.getElementById('modeTag').className = state.mode==='hard'?'hard':'normal';
    document.getElementById('log').innerHTML = "";
    document.getElementById('winOverlay').classList.add('hidden');
    buildBoardDOM(); drawOverlay();
  }

  function handleOnlineSnapshot(state, processedSeq, setProcessed){
    const incomingSeq = state.moveSeq || 0;
    if(incomingSeq > 0 && incomingSeq > processedSeq && state.lastMove){
      setProcessed(incomingSeq);
      playMoveAnimation(state.players, state.lastMove, ()=>{
        onlineGameState = state;
        settleOnlineUI(state);
      });
    } else {
      setProcessed(incomingSeq);
      onlineGameState = state;
      renderPlayers(state); renderTokens(state.players);
      settleOnlineUI(state);
    }
  }

  function settleOnlineUI(state){
    renderPlayers(state); renderTokens(state.players);
    if(state.status === 'finished'){
      endGame(state);
      return;
    }
    const cp = state.players[state.turnIndex];
    const myTurn = !cp.isBot && cp.uid === MY_UID;
    const iAmHost = state.hostUid === MY_UID;

    document.getElementById('rollBtn').disabled = !myTurn || onlineBusy;
    document.getElementById('rollBtn').textContent = myTurn ? 'ROLL DICE' : `Waiting for ${cp.name || 'player'}…`;
    if(myTurn) setTurnMessage("Your turn — roll the dice!");
    else setTurnMessage(`${cp.name || 'Seat '+cp.id}${cp.isBot?' 🤖':''}'s turn…`);

    if(cp.isBot && iAmHost && !onlineBusy){
      setTimeout(()=>{ driveBotTurn(state.turnIndex); }, 800);
    }
  }

  document.getElementById('rollBtn').addEventListener('click', ()=>{
    if(mode!=='online' || onlineBusy) return;
    const state = onlineGameState;
    if(!state) return;
    const cp = state.players[state.turnIndex];
    if(cp.isBot || cp.uid !== MY_UID) return;
    onlineBusy = true;
    document.getElementById('rollBtn').disabled = true;
    rollDiceAnimated(roll=>{
      commitOnlineMove(state.turnIndex, roll).finally(()=>{ onlineBusy = false; });
    });
  });

  function driveBotTurn(expectedTurnIndex){
    if(onlineBusy) return;
    onlineBusy = true;
    rollDiceAnimated(roll=>{
      commitOnlineMove(expectedTurnIndex, roll).finally(()=>{ onlineBusy = false; });
    });
  }

  async function commitOnlineMove(expectedTurnIndex, roll){
    try{
      await updateRoomOptimistic(currentRoomCode, (current)=>{
        if(current.status!=='playing' || current.turn_index!==expectedTurnIndex) return null; // stale, ignore
        const result = computeMove(mapRowToState(current), roll);
        return {
          players: result.players, turn_index: result.turnIndex, status: result.status,
          winner_id: result.winnerId, move_seq: result.moveSeq, last_move: result.lastMove
        };
      });
    }catch(e){ console.error('move failed', e); }
  }

  /* ================= END GAME / STATS ================= */
  function endGame(state){
    document.getElementById('winOverlay').classList.remove('hidden');
    const winner = state.players.find(p=>p.id===state.winnerId);
    document.getElementById('winText').textContent = winner
      ? `🎉 ${winner.name || 'Seat '+winner.id}${winner.isBot?' (Bot)':''} Wins! 🎉`
      : `🎉 Game Over 🎉`;
    saveStats(winner);
  }

  async function saveStats(winner){
    if(!backendReady || !sb) return;
    try{
      const {data:cur} = await sb.from('players').select('*').eq('uid',MY_UID).maybeSingle();
      const iWon = winner && winner.uid === MY_UID;
      await sb.from('players').upsert({
        uid: MY_UID,
        name: localStorage.getItem('sl_name') || 'Player',
        games_played: (cur?.games_played||0) + 1,
        games_won: (cur?.games_won||0) + (iWon?1:0),
        last_played: Date.now()
      }, {onConflict:'uid'});
    }catch(e){ console.warn('stats save failed (non-fatal)', e); }
  }

  document.getElementById('restartBtn').addEventListener('click', resetToHome);
  document.getElementById('playAgainBtn').addEventListener('click', resetToHome);
  function resetToHome(){
    leaveLobby();
    mode = null; localState = null; onlineGameState = null;
    document.getElementById('winOverlay').classList.add('hidden');
    showScreen('home');
  }

  document.addEventListener('dblclick', e=>e.preventDefault());

})();
</script>
</body>
</html>
